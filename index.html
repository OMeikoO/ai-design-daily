<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="AI / 科技 / 设计每日资讯 · iOS 27 Liquid Glass 设计">
<title>AI Design Daily · 每日资讯</title>
<style>
/* ============================================================
   iOS 27 Liquid Glass Design Tokens
   ============================================================ */
:root {
  /* Light mode */
  --bg-base: #f2f2f7;
  --bg-gradient-1: rgba(255, 255, 255, 0.85);
  --bg-gradient-2: rgba(240, 244, 255, 0.7);
  --bg-gradient-3: rgba(255, 240, 245, 0.5);

  --glass-bg: rgba(255, 255, 255, 0.6);
  --glass-bg-strong: rgba(255, 255, 255, 0.78);
  --glass-bg-elevated: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(255, 255, 255, 0.7);
  --glass-border-subtle: rgba(0, 0, 0, 0.06);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
  --glass-shadow-strong: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
  --glass-blur: 30px;

  --text-primary: #1c1c1e;
  --text-secondary: #6e6e73;
  --text-tertiary: #a1a1a6;

  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.12);
  --accent-glow: rgba(10, 132, 255, 0.25);

  --danger: #ff3b30;
  --success: #30d158;
  --warning: #ff9f0a;

  --cat-interaction: #0a84ff;
  --cat-styles: #bf5af2;
  --cat-tools: #30d158;
  --cat-tips: #ff9f0a;
  --cat-tech: #64d2ff;
  --cat-design: #ff375f;

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --header-h: 64px;
  --search-h: 56px;
  --filter-h: 56px;

  /* Layout widths */
  --content-max: 1700px;
  --list-col-w: 340px;
  --kb-col-w: 360px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-base: #000000;
    --bg-gradient-1: rgba(28, 28, 30, 0.85);
    --bg-gradient-2: rgba(20, 20, 35, 0.7);
    --bg-gradient-3: rgba(35, 20, 30, 0.5);

    --glass-bg: rgba(28, 28, 30, 0.6);
    --glass-bg-strong: rgba(44, 44, 46, 0.78);
    --glass-bg-elevated: rgba(58, 58, 60, 0.85);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-subtle: rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
    --glass-shadow-strong: 0 12px 40px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);

    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #6e6e73;

    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.18);
    --accent-glow: rgba(10, 132, 255, 0.4);

    --cat-interaction: #5ac8fa;
    --cat-styles: #d9b4ff;
    --cat-tools: #4ade80;
    --cat-tips: #ffd60a;
    --cat-tech: #64d2ff;
    --cat-design: #ff6482;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: none;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, var(--bg-gradient-1) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 10%, var(--bg-gradient-2) 0%, transparent 50%),
    radial-gradient(ellipse 100% 50% at 50% 100%, var(--bg-gradient-3) 0%, transparent 60%),
    var(--bg-base);
  background-attachment: fixed;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }
a { color: inherit; }

/* ============================================================
   Header (sticky glass)
   ============================================================ */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: var(--safe-top) 0 0;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border-bottom: 1px solid var(--glass-border-subtle);
}

.header-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 0 20px;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}

.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0a84ff 0%, #bf5af2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 18px;
  box-shadow: 0 4px 12px var(--accent-glow);
  flex-shrink: 0;
}

.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-sub {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-actions { display: flex; align-items: center; gap: 8px; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  position: relative;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--glass-bg-elevated); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sync-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: #fff;
  border: 1px solid var(--accent);
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 4px 12px var(--accent-glow);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.sync-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-glow); }
.sync-btn:active { transform: scale(0.96); }
.sync-btn svg { width: 16px; height: 16px; }
.sync-btn.spinning { pointer-events: none; opacity: 0.8; }
.sync-btn.spinning svg { animation: spin 1s linear infinite; }

.badge-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  min-width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
  border: 2px solid var(--glass-bg-strong);
  display: none;
}
.badge-dot.show { display: block; box-shadow: 0 0 0 0 var(--danger); animation: pulse 2s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
  70% { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
}

/* ============================================================
   Search bar
   ============================================================ */
.search-wrap {
  position: sticky;
  top: calc(var(--safe-top) + var(--header-h));
  z-index: 49;
  padding: 12px 0;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border-bottom: 1px solid var(--glass-border-subtle);
}
.search-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 0 20px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 16px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.search-box svg { width: 18px; height: 18px; color: var(--text-secondary); flex-shrink: 0; }
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
}
.search-input::placeholder { color: var(--text-tertiary); }
.search-clear {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--text-tertiary);
  color: var(--bg-base);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  flex-shrink: 0;
}
.search-clear.show { display: flex; }

/* ============================================================
   Filter chips
   ============================================================ */
.filter-wrap {
  position: sticky;
  top: calc(var(--safe-top) + var(--header-h) + 68px);
  z-index: 48;
  padding: 8px 0;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border-bottom: 1px solid var(--glass-border-subtle);
}
.filter-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.filter-inner::-webkit-scrollbar { display: none; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-pill);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  flex-shrink: 0;
}
.chip:hover { background: var(--glass-bg-elevated); }
.chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.chip-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.chip-count {
  font-size: 11px;
  opacity: 0.7;
  margin-left: 2px;
}

/* ============================================================
   Layout: 3-column on desktop
   ============================================================ */
.layout {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 20px 20px 40px;
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr; /* mobile default */
}

@media (min-width: 1024px) {
  .layout {
    grid-template-columns: minmax(320px, var(--list-col-w)) 1fr;
    gap: 20px;
  }
}

@media (min-width: 1280px) {
  .layout {
    grid-template-columns: minmax(340px, var(--list-col-w)) 1fr minmax(340px, var(--kb-col-w));
  }
}

@media (min-width: 1440px) {
  :root {
    --list-col-w: 380px;
    --kb-col-w: 400px;
  }
}

@media (min-width: 1700px) {
  :root { --content-max: 100%; --list-col-w: 420px; --kb-col-w: 440px; }
  .layout { padding: 24px 32px 40px; }
}

/* List column */
.list-col { min-width: 0; }

/* Detail column (PC only) */
.detail-col {
  display: none;
  min-height: 600px;
}
@media (min-width: 1024px) {
  .detail-col { display: block; }
}

/* KB column (PC only on large screens) */
.kb-col {
  display: none;
  min-height: 600px;
}
@media (min-width: 1280px) {
  .kb-col { display: block; }
}

/* Mobile KB still uses drawer */
@media (max-width: 1279px) {
  .kb-col { display: none !important; }
}

/* ============================================================
   Update banner
   ============================================================ */
.update-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  box-shadow: var(--glass-shadow);
}
.update-banner-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #5ac8fa);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
}
.update-banner-icon svg { width: 14px; height: 14px; }
.update-banner-text { flex: 1; min-width: 0; }
.update-banner-title { font-size: 13px; font-weight: 600; }
.update-banner-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
.update-banner-action {
  padding: 5px 10px;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
}
.update-banner-action:hover { background: var(--accent); color: #fff; }

/* ============================================================
   News grid (list column)
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 768px) and (max-width: 1023px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}

/* ============================================================
   News card (list)
   ============================================================ */
.card {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 14px 16px 12px;
  box-shadow: var(--glass-shadow);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.2s;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--cat-color, var(--accent));
  opacity: 0.85;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--glass-shadow-strong);
}
.card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), var(--glass-shadow-strong);
}
.card.read { opacity: 0.62; }
.card.read .card-title { color: var(--text-secondary); }

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.cat-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: var(--cat-color-soft, var(--accent-soft));
  color: var(--cat-color, var(--accent));
  border-radius: var(--radius-pill);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2px;
  text-transform: uppercase;
}
.cat-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.card-date {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-left: auto;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.2px;
  line-height: 1.35;
  color: var(--text-primary);
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-summary {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-secondary);
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.tag {
  padding: 2px 7px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border-subtle);
  border-radius: var(--radius-sm);
  font-size: 10px;
  color: var(--text-secondary);
}

.card-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  padding-top: 8px;
  border-top: 1px solid var(--glass-border-subtle);
}
.card-source {
  flex: 1;
  font-size: 11px;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-actions { display: flex; gap: 6px; }

.action-btn {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-decoration: none;
}
.action-btn:hover { background: var(--glass-bg-elevated); color: var(--text-primary); }
.action-btn:active { transform: scale(0.9); }
.action-btn svg { width: 14px; height: 14px; }
.action-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.action-btn.active.kb { background: var(--cat-tips, #ff9f0a); border-color: var(--cat-tips, #ff9f0a); }
.action-btn.active.read { background: var(--success); border-color: var(--success); }

/* ============================================================
   Empty state
   ============================================================ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.empty-icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--glass-bg-strong);
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty-icon svg { width: 28px; height: 28px; color: var(--text-tertiary); }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty-sub { font-size: 13px; }

/* ============================================================
   Loading skeleton
   ============================================================ */
.skeleton-card {
  height: 160px;
  border-radius: var(--radius-lg);
  background: linear-gradient(90deg, var(--glass-bg) 0%, var(--glass-bg-strong) 50%, var(--glass-bg) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border: 1px solid var(--glass-border-subtle);
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* ============================================================
   Detail panel (PC center column)
   ============================================================ */
.detail-panel {
  position: sticky;
  top: calc(var(--safe-top) + var(--header-h) + 68px + 16px);
  height: calc(100vh - var(--safe-top) - var(--header-h) - 68px - 32px);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.detail-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-tertiary);
  text-align: center;
  padding: 40px;
}
.detail-empty svg { width: 56px; height: 56px; margin-bottom: 16px; opacity: 0.5; }
.detail-empty-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.detail-empty-sub { font-size: 12px; }

.detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.detail-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.detail-meta .cat-tag { font-size: 11px; padding: 4px 10px; }
.detail-date { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }

.detail-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.3;
  margin: 0;
  color: var(--text-primary);
}

.detail-summary {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-secondary);
  margin: 0;
  padding: 16px;
  background: var(--glass-bg-strong);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--cat-color, var(--accent));
}

.detail-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.detail-tags .tag { font-size: 11px; padding: 3px 8px; }

.detail-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 12px;
  border-top: 1px solid var(--glass-border-subtle);
  margin-top: auto;
}
.detail-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.detail-action.primary {
  background: var(--accent);
  color: #fff;
  border: 1px solid var(--accent);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.detail-action.primary:hover { transform: translateY(-1px); }
.detail-action.primary.active {
  background: var(--cat-tips, #ff9f0a);
  border-color: var(--cat-tips, #ff9f0a);
  box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3);
}
.detail-action.secondary {
  background: var(--glass-bg-strong);
  color: var(--text-primary);
  border: 1px solid var(--glass-border);
}
.detail-action.secondary:hover { background: var(--glass-bg-elevated); }
.detail-action svg { width: 15px; height: 15px; }
.detail-action.read.active {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}

.detail-source {
  font-size: 12px;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-source a { color: var(--accent); text-decoration: none; word-break: break-all; }

/* ============================================================
   KB panel (PC right column / mobile drawer)
   ============================================================ */
.kb-panel {
  position: sticky;
  top: calc(var(--safe-top) + var(--header-h) + 68px + 16px);
  height: calc(100vh - var(--safe-top) - var(--header-h) - 68px - 32px);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.kb-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border-subtle);
}
.kb-title { flex: 1; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.kb-title svg { width: 16px; height: 16px; color: var(--accent); }
.kb-count {
  font-size: 11px;
  color: var(--accent);
  padding: 2px 8px;
  background: var(--accent-soft);
  border-radius: var(--radius-pill);
  font-weight: 600;
}
.kb-actions { display: flex; gap: 6px; }
.kb-mini-btn {
  width: 30px; height: 30px;
  border-radius: var(--radius-sm);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.kb-mini-btn:hover { background: var(--glass-bg-elevated); color: var(--text-primary); }
.kb-mini-btn svg { width: 14px; height: 14px; }

.kb-mini-btn.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 2px 8px var(--accent-glow);
}
.kb-mini-btn.primary:hover { background: #006edc; }

/* New item form */
.kb-new-form {
  padding: 12px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: var(--radius-md);
  display: none;
  flex-direction: column;
  gap: 8px;
}
.kb-new-form.show { display: flex; }
.kb-new-form input,
.kb-new-form textarea,
.kb-new-form select {
  width: 100%;
  border: 1px solid var(--glass-border);
  background: var(--bg-base);
  color: var(--text-primary);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  outline: none;
  font-family: inherit;
}
.kb-new-form input:focus,
.kb-new-form textarea:focus,
.kb-new-form select:focus { border-color: var(--accent); }
.kb-new-form textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.kb-new-form-row { display: flex; gap: 6px; }
.kb-new-form-row > * { flex: 1; }
.kb-new-submit {
  padding: 8px 14px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
}
.kb-new-submit:hover { background: #006edc; }
.kb-new-cancel {
  padding: 8px 14px;
  background: var(--glass-bg-strong);
  color: var(--text-secondary);
  border: 1px solid var(--glass-border-subtle);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
}
.kb-new-hint { font-size: 11px; color: var(--text-tertiary); line-height: 1.5; }
.kb-new-fetch-btn {
  padding: 8px 10px;
  background: var(--glass-bg-strong);
  color: var(--text-primary);
  border: 1px solid var(--glass-border-subtle);
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.kb-new-fetch-btn:hover { background: var(--glass-bg-elevated); }
.kb-new-fetch-btn.spinning svg { animation: spin 1s linear infinite; }

/* Article full text */
.detail-article {
  font-size: 14px;
  line-height: 1.75;
  color: var(--text-primary);
  padding: 16px;
  background: var(--glass-bg-strong);
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border-subtle);
  max-height: 60vh;
  overflow-y: auto;
}
.detail-article p { margin: 0 0 12px; }
.detail-article h1, .detail-article h2, .detail-article h3 {
  font-size: 16px;
  font-weight: 700;
  margin: 16px 0 8px;
  color: var(--text-primary);
}
.detail-article img { max-width: 100%; height: auto; border-radius: var(--radius-sm); margin: 8px 0; }
.detail-article a { color: var(--accent); text-decoration: underline; word-break: break-all; }
.detail-article blockquote {
  margin: 12px 0;
  padding: 8px 14px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  color: var(--text-primary);
  font-style: italic;
}
.detail-article pre {
  background: var(--bg-base);
  padding: 10px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  font-size: 12px;
  margin: 8px 0;
}
.detail-article code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.detail-article ul, .detail-article ol { margin: 8px 0; padding-left: 24px; }
.detail-article li { margin: 4px 0; }
.detail-article-loading {
  text-align: center;
  padding: 30px 16px;
  color: var(--text-secondary);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.detail-article-loading .spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--accent-soft);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.detail-article-error {
  padding: 14px 16px;
  background: rgba(255, 59, 48, 0.08);
  border: 1px solid rgba(255, 59, 48, 0.3);
  color: var(--danger);
  border-radius: var(--radius-md);
  font-size: 13px;
  line-height: 1.6;
}
.detail-article-error a { color: var(--accent); text-decoration: underline; }
.detail-article-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  background: var(--glass-bg-strong);
  color: var(--text-primary);
  border: 1px solid var(--glass-border);
  transition: all 0.2s;
}
.detail-article-toggle:hover { background: var(--glass-bg-elevated); }
.detail-article-toggle svg { width: 15px; height: 15px; }
.detail-article-toggle.loading { pointer-events: none; opacity: 0.7; }
.detail-article-toggle.loading svg { animation: spin 1s linear infinite; }

.kb-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.kb-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-tertiary);
}
.kb-empty svg { width: 40px; height: 40px; margin: 0 auto 12px; display: block; color: var(--text-tertiary); }
.kb-empty-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.kb-empty-sub { font-size: 11px; line-height: 1.5; }

.kb-item {
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border-subtle);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.2s;
}
.kb-item:hover { border-color: var(--glass-border); }
.kb-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.kb-item-meta { display: flex; align-items: center; gap: 6px; }
.kb-item-meta .cat-tag { font-size: 10px; padding: 2px 7px; }

.kb-item-title-edit {
  width: 100%;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  outline: none;
  padding: 2px 0;
  border-bottom: 1px dashed transparent;
  transition: border-color 0.2s;
}
.kb-item-title-edit:focus { border-bottom-color: var(--accent); }

.kb-item-summary {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Rich text editor */
.kb-toolbar {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border-subtle);
  border-radius: var(--radius-sm);
  margin-bottom: -4px;
}
.kb-tool {
  width: 26px; height: 26px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  transition: all 0.15s;
}
.kb-tool:hover { background: var(--glass-bg-strong); color: var(--text-primary); }
.kb-tool.active { background: var(--accent); color: #fff; }
.kb-tool svg { width: 14px; height: 14px; }

.kb-item-note-edit {
  width: 100%;
  min-height: 60px;
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--glass-border-subtle);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.6;
  outline: none;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  transition: border-color 0.2s;
}
.kb-item-note-edit:focus { border-color: var(--accent); }
.kb-item-note-edit.empty::before {
  content: attr(data-placeholder);
  color: var(--text-tertiary);
  pointer-events: none;
}
.kb-item-note-edit b, .kb-item-note-edit strong { font-weight: 700; }
.kb-item-note-edit i, .kb-item-note-edit em { font-style: italic; }
.kb-item-note-edit ul, .kb-item-note-edit ol { margin: 4px 0; padding-left: 20px; }
.kb-item-note-edit li { margin: 2px 0; }
.kb-item-note-edit a { color: var(--accent); text-decoration: underline; }
.kb-item-note-edit code { background: var(--glass-bg-strong); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.kb-item-note-edit blockquote {
  margin: 6px 0;
  padding: 4px 10px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  color: var(--text-primary);
}

.kb-item-footer {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 4px;
}
.kb-item-btn {
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  transition: all 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.kb-item-btn svg { width: 12px; height: 12px; }
.kb-item-btn.open { background: var(--accent); color: #fff; }
.kb-item-btn.remove { background: rgba(255, 59, 48, 0.12); color: var(--danger); }

/* ============================================================
   Mobile KB drawer (max-width: 1279px)
   ============================================================ */
.kb-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.kb-overlay.show { opacity: 1; pointer-events: auto; }
@media (min-width: 1280px) {
  .kb-overlay { display: none; }
}

.kb-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 100%;
  max-width: 420px;
  background: var(--bg-base);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
.kb-drawer.show { transform: translateX(0); }
@media (min-width: 1280px) {
  .kb-drawer { display: none; }
}
.kb-drawer .kb-panel {
  position: static;
  height: 100%;
  border: none;
  border-radius: 0;
  box-shadow: none;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* ============================================================
   Floating action button (mobile)
   ============================================================ */
.fab {
  position: fixed;
  bottom: calc(20px + var(--safe-bottom));
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, #5ac8fa 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px var(--accent-glow), 0 2px 8px rgba(0, 0, 0, 0.2);
  z-index: 40;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.fab:hover { transform: scale(1.05); }
.fab:active { transform: scale(0.92); }
.fab svg { width: 24px; height: 24px; }
.fab .badge-dot { top: 8px; right: 8px; border-color: var(--accent); }
@media (min-width: 1280px) {
  .fab { display: none; }
}

/* ============================================================
   Footer
   ============================================================ */
.footer {
  max-width: var(--content-max);
  margin: 24px auto 0;
  padding: 16px 20px;
  text-align: center;
  font-size: 11px;
  color: var(--text-tertiary);
}
.footer a { color: var(--accent); text-decoration: none; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
  position: fixed;
  bottom: calc(90px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 18px;
  background: var(--glass-bg-elevated);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  box-shadow: var(--glass-shadow-strong);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 1280px) {
  .toast { bottom: 30px; }
}

/* ============================================================
   Mobile adjustments
   ============================================================ */
@media (max-width: 767px) {
  .header-inner { padding: 0 16px; height: 56px; gap: 10px; }
  .brand-logo { width: 32px; height: 32px; font-size: 16px; }
  .brand-title { font-size: 15px; }
  .brand-sub { font-size: 11px; }
  .icon-btn { width: 36px; height: 36px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .sync-btn { padding: 0 12px; height: 36px; font-size: 12px; }
  .sync-btn span { display: none; }
  .sync-btn svg { width: 18px; height: 18px; }

  .search-wrap { top: calc(var(--safe-top) + 56px); }
  .search-inner { padding: 0 16px; }
  .filter-wrap { top: calc(var(--safe-top) + 56px + 68px); }
  .filter-inner { padding: 0 16px; }

  .layout { padding: 16px 16px 100px; gap: 12px; }
  .card { padding: 12px 14px; gap: 6px; }
  .card-title { font-size: 14px; }
  .card-summary { font-size: 12px; }

  :root { --header-h: 56px; }
}
</style>
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">AI</div>
      <div class="brand-text">
        <div class="brand-title">AI Design Daily</div>
        <div class="brand-sub" id="brand-sub">加载中...</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="sync-btn" id="sync-btn" title="同步截止上一小时的最新资讯" aria-label="同步最新资讯">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>同步</span>
      </button>
      <button class="icon-btn" id="open-kb" title="知识库" aria-label="知识库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="badge-dot" id="kb-badge"></span>
      </button>
    </div>
  </div>
</header>

<!-- ============================================================
     Search
     ============================================================ -->
<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" class="search-input" id="search-input" placeholder="搜索标题、摘要、标签..." autocomplete="off">
      <button class="search-clear" id="search-clear" aria-label="清除搜索">×</button>
    </div>
  </div>
</div>

<!-- ============================================================
     Filters
     ============================================================ -->
<div class="filter-wrap">
  <div class="filter-inner" id="filter-chips"></div>
</div>

<!-- ============================================================
     Layout (3-column on desktop)
     ============================================================ -->
<main class="layout">
  <!-- Left: list -->
  <section class="list-col">
    <div id="update-banner"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Center: detail (PC only) -->
  <section class="detail-col">
    <div class="detail-panel" id="detail-panel">
      <div class="detail-empty" id="detail-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <div class="detail-empty-title">点击左侧卡片预览全文</div>
        <div class="detail-empty-sub">选中后此处展开摘要、标签与操作</div>
      </div>
      <div class="detail-content" id="detail-content" style="display:none"></div>
    </div>

  <!-- Right: KB (PC only on large screens) -->
  <aside class="kb-col">
    <div class="kb-panel" id="kb-panel-pc"></div>
  </aside>
</main>

<!-- ============================================================
     Mobile KB drawer
     ============================================================ -->
<div class="kb-overlay" id="kb-overlay"></div>
<aside class="kb-drawer" id="kb-drawer" aria-hidden="true">
  <div class="kb-panel" id="kb-panel-mobile"></div>
</aside>

<input type="file" id="kb-import-input" accept=".json" style="display:none">

<!-- ============================================================
     FAB (mobile)
     ============================================================ -->
<button class="fab" id="fab-kb" aria-label="打开知识库">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
  <span class="badge-dot" id="fab-kb-badge"></span>
</button>

<!-- ============================================================
     Footer
     ============================================================ -->
<footer class="footer">
  <div id="footer-info">每日 09:00 自动更新 · 同步按钮获取截止上小时增量</div>
  <div style="margin-top:6px;"><a href="https://github.com/OMeikoO/ai-design-daily" target="_blank" rel="noopener">OMeikoO/ai-design-daily</a></div>
</footer>

<!-- ============================================================
     Toast
     ============================================================ -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   State
   ============================================================ */
const STATE = {
  data: null,
  incremental: null, // incrementally synced items
  filter: 'all',
  query: '',
  selectedId: null,
  readItems: new Set(JSON.parse(localStorage.getItem('ai-design-daily:read') || '[]')),
  kbItems: new Map(JSON.parse(localStorage.getItem('ai-design-daily:kb') || '[]')),
  lastViewedDate: localStorage.getItem('ai-design-daily:last-viewed') || '',
  lastSyncAt: localStorage.getItem('ai-design-daily:last-sync') || '',
};

const ALL_CATEGORIES = [
  { id: 'interaction', name: '交互设计', icon: '✦', color: '#0a84ff' },
  { id: 'styles', name: '设计风格', icon: '◈', color: '#bf5af2' },
  { id: 'tools', name: 'AI 工具', icon: '◆', color: '#30d158' },
  { id: 'tips', name: 'AI 技巧', icon: '✸', color: '#ff9f0a' },
  { id: 'tech', name: '科技动态', icon: '❖', color: '#64d2ff' },
  { id: 'design', name: '设计视野', icon: '❂', color: '#ff375f' },
];

/* ============================================================
   Utils
   ============================================================ */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return [...(root || document).querySelectorAll(sel)]; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!d) return '';
  const date = new Date(d);
  if (isNaN(date)) return d;
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${date.getFullYear()}-${m}-${day}`;
}
function relDate(d) {
  if (!d) return '';
  const date = new Date(d);
  if (isNaN(date)) return d;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(date);
  target.setHours(0, 0, 0, 0);
  const diff = Math.round((today - target) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff > 0 && diff < 7) return `${diff}天前`;
  if (diff < 0 && diff > -7) return `${-diff}天后`;
  return fmtDate(d);
}
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function saveState() {
  localStorage.setItem('ai-design-daily:read', JSON.stringify([...STATE.readItems]));
  localStorage.setItem('ai-design-daily:kb', JSON.stringify([...STATE.kbItems].map(([k, v]) => [k, v])));
}

function findItem(id) {
  if (!id) return null;
  if (STATE.data) {
    const found = STATE.data.items.find(i => i.id === id);
    if (found) return found;
  }
  if (STATE.incremental) {
    const found = STATE.incremental.items.find(i => i.id === id);
    if (found) return found;
  }
  // fallback to KB-stored item
  const note = STATE.kbItems.get(id);
  if (note && typeof note === 'object' && note.item) return note.item;
  return null;
}

function allItems() {
  const seen = new Set();
  const out = [];
  const inc = (STATE.incremental && STATE.incremental.items) ? [...STATE.incremental.items].reverse() : [];
  const base = (STATE.data && STATE.data.items) ? STATE.data.items : [];
  for (const it of [...inc, ...base]) {
    if (seen.has(it.id)) continue;
    seen.add(it.id);
    out.push(it);
  }
  return out;
}

function allCategories() {
  if (STATE.data && STATE.data.categories && STATE.data.categories.length) {
    return STATE.data.categories;
  }
  return ALL_CATEGORIES;
}

/* ============================================================
   Render: brand + banner + filters
   ============================================================ */
function renderBrandSub() {
  if (!STATE.data) return;
  const d = STATE.data.date;
  const incCount = STATE.incremental ? STATE.incremental.items.length : 0;
  const baseCount = STATE.data.totalItems || STATE.data.items.length;
  const total = baseCount + incCount;
  let txt = `${fmtDate(d)} · ${total} 条`;
  if (incCount > 0) txt += ` · 新增 ${incCount}`;
  $('#brand-sub').textContent = txt;
}

function renderUpdateBanner() {
  const banner = $('#update-banner');
  if (!STATE.data) return;
  const isNew = STATE.data.date !== STATE.lastViewedDate;
  banner.innerHTML = `
    <div class="update-banner-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </div>
    <div class="update-banner-text">
      <div class="update-banner-title">${isNew ? '今日新内容已就绪' : '当前为最新内容'}</div>
      <div class="update-banner-sub">${STATE.data.updatedAt ? '更新于 ' + STATE.data.updatedAt.replace('T', ' ').slice(0, 16) : '每日 09:00 自动刷新'}</div>
    </div>
    ${isNew ? `<button class="update-banner-action" id="banner-mark-read">标为已读</button>` : ''}
  `;
  const markBtn = $('#banner-mark-read');
  if (markBtn) markBtn.onclick = markAllRead;

  if (isNew) {
    $('#kb-badge').classList.add('show');
    $('#fab-kb-badge').classList.add('show');
  } else {
    $('#kb-badge').classList.remove('show');
    $('#fab-kb-badge').classList.remove('show');
  }
}

function renderFilters() {
  const wrap = $('#filter-chips');
  if (!STATE.data) return;
  const items = allItems();
  const counts = { all: items.length };
  for (const c of allCategories()) {
    counts[c.id] = items.filter(i => i.category === c.id).length;
  }
  const chips = [
    `<button class="chip ${STATE.filter === 'all' ? 'active' : ''}" data-cat="all">全部<span class="chip-count">${counts.all}</span></button>`,
    ...allCategories().map(c => `
      <button class="chip ${STATE.filter === c.id ? 'active' : ''}" data-cat="${c.id}">
        <span class="chip-dot" style="color:${c.color}"></span>
        ${c.name}<span class="chip-count">${counts[c.id] || 0}</span>
      </button>
    `),
  ];
  wrap.innerHTML = chips.join('');
  wrap.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      STATE.filter = btn.dataset.cat;
      renderFilters();
      renderGrid();
    };
  });
}

/* ============================================================
   Render: news list
   ============================================================ */
function renderGrid() {
  const grid = $('#grid');
  if (!STATE.data) return;

  let items = allItems();
  if (STATE.filter !== 'all') {
    items = items.filter(i => i.category === STATE.filter);
  }
  if (STATE.query.trim()) {
    const q = STATE.query.trim().toLowerCase();
    items = items.filter(i =>
      (i.title && i.title.toLowerCase().includes(q)) ||
      (i.summary && i.summary.toLowerCase().includes(q)) ||
      (i.tags && i.tags.some(t => t.toLowerCase().includes(q)))
    );
  }

  if (items.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <div class="empty-title">没有匹配的资讯</div>
        <div class="empty-sub">试试更换关键词或切换分类</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = items.map(item => {
    const cat = allCategories().find(c => c.id === item.category) || { name: '', color: '#0a84ff' };
    const color = cat.color;
    const isRead = STATE.readItems.has(item.id);
    const inKb = STATE.kbItems.has(item.id);
    const isActive = STATE.selectedId === item.id;
    const isInc = STATE.incremental && STATE.incremental.items.some(i => i.id === item.id);
    return `
      <article class="card ${isRead ? 'read' : ''} ${isActive ? 'active' : ''}" data-id="${item.id}" style="--cat-color:${color};--cat-color-soft:${color}22">
        <div class="card-header">
          <span class="cat-tag" style="color:${color}">
            <span class="cat-dot"></span>
            ${cat.name}
          </span>
          ${isInc ? `<span class="cat-tag" style="color:#ff3b30;background:rgba(255,59,48,0.12)"><span class="cat-dot"></span>NEW</span>` : ''}
          <span class="card-date">${relDate(item.publishedAt)}</span>
        </div>
        <h3 class="card-title">${escapeHtml(item.title)}</h3>
        <p class="card-summary">${escapeHtml(item.summary)}</p>
        ${item.tags && item.tags.length ? `<div class="card-tags">${item.tags.slice(0, 4).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="card-footer">
          <span class="card-source">${escapeHtml(item.source || '')}</span>
          <div class="card-actions">
            <button class="action-btn ${inKb ? 'active kb' : ''}" data-action="kb" data-id="${item.id}" title="${inKb ? '移出知识库' : '加入知识库'}" aria-label="加入知识库">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button class="action-btn ${isRead ? 'active read' : ''}" data-action="read" data-id="${item.id}" title="${isRead ? '取消已读' : '标记已读'}" aria-label="标记已读">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
        </div>
      </article>
    `;
  }).join('');

  // Wire card click → select + show detail (PC)
  grid.querySelectorAll('.card').forEach(card => {
    card.onclick = (e) => {
      if (e.target.closest('[data-action]') || e.target.closest('a')) return;
      selectItem(card.dataset.id);
    };
  });
  grid.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (action === 'read') toggleRead(id);
      else if (action === 'kb') {
        toggleKb(id);
        // If just added, also select it so detail panel shows (PC)
        if (STATE.kbItems.has(id)) selectItem(id);
      }
    };
  });
}

/* ============================================================
   Render: detail panel (PC center column)
   ============================================================ */
function renderDetail() {
  const panel = $('#detail-panel');
  if (!panel) return;
  const empty = $('#detail-empty');
  const content = $('#detail-content');
  if (!STATE.selectedId) {
    empty.style.display = 'flex';
    content.style.display = 'none';
    return;
  }
  const item = findItem(STATE.selectedId);
  if (!item) {
    empty.style.display = 'flex';
    content.style.display = 'none';
    return;
  }
  const cat = allCategories().find(c => c.id === item.category) || { name: '', color: '#0a84ff' };
  const color = cat.color;
  const isRead = STATE.readItems.has(item.id);
  const inKb = STATE.kbItems.has(item.id);
  empty.style.display = 'none';
  content.style.display = 'flex';
  content.style.setProperty('--cat-color', color);
  content.innerHTML = `
    <div class="detail-meta">
      <span class="cat-tag" style="color:${color}">
        <span class="cat-dot"></span>${cat.name}
      </span>
      <span class="detail-date">${fmtDate(item.publishedAt)} · ${relDate(item.publishedAt)}</span>
    </div>
    <h2 class="detail-title">${escapeHtml(item.title)}</h2>
    <div class="detail-summary">${escapeHtml(item.summary)}</div>
    ${item.tags && item.tags.length ? `<div class="detail-tags">${item.tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    <div class="detail-source">
      来源: ${escapeHtml(item.source || '未知')}
      ${item.url ? ` · <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">查看原文 ↗</a>` : ''}
    </div>
    ${item.url ? `<button class="detail-article-toggle" id="detail-load-article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      <span class="detail-article-toggle-label">加载全文</span>
    </button>` : ''}
    <div id="detail-article-container"></div>
    <div class="detail-actions">
      <button class="detail-action primary ${inKb ? 'active' : ''}" id="detail-kb-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        ${inKb ? '已加入知识库' : '加入知识库'}
      </button>
      <button class="detail-action read ${isRead ? 'active' : ''}" id="detail-read-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        ${isRead ? '已读' : '标为已读'}
      </button>
      ${item.url ? `<a class="detail-action secondary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        原文
      </a>` : ''}
    </div>
  `;
  // Load article full text button
  const loadBtn = $('#detail-load-article');
  if (loadBtn) loadBtn.onclick = () => loadArticleFullText(item, loadBtn);
  const kbBtn = $('#detail-kb-toggle');
  if (kbBtn) kbBtn.onclick = () => {
    toggleKb(item.id);
    renderDetail();
    renderGrid();
  };
  const readBtn = $('#detail-read-toggle');
  if (readBtn) readBtn.onclick = () => {
    toggleRead(item.id);
    renderDetail();
    renderGrid();
  };
}

function selectItem(id) {
  STATE.selectedId = id;
  // mark read on view
  if (!STATE.readItems.has(id)) {
    STATE.readItems.add(id);
    saveState();
  }
  renderGrid();
  renderDetail();
}

/* ============================================================
   Render: KB panel (both PC column and mobile drawer share the same renderer)
   ============================================================ */
function renderKbPanel(root) {
  if (!root) return;
  const count = STATE.kbItems.size;
  root.innerHTML = `
    <div class="kb-header">
      <div class="kb-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        知识库
      </div>
      <span class="kb-count">${count}</span>
      <div class="kb-actions">
        <button class="kb-mini-btn primary kb-new-toggle" title="新建条目" aria-label="新建条目">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="kb-mini-btn kb-export" title="导出 JSON" aria-label="导出">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="kb-mini-btn kb-import" title="导入 JSON" aria-label="导入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
      </div>
    </div>
    <div class="kb-new-form" id="kb-new-form-${root.id}">
      <input class="kb-new-url" type="url" placeholder="原文 URL（可选，粘贴后点抓取自动填充）">
      <div class="kb-new-form-row">
        <button class="kb-new-fetch-btn" title="从 URL 抓取标题和摘要">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          抓取
        </button>
      </div>
      <input class="kb-new-title" type="text" placeholder="标题（必填）">
      <textarea class="kb-new-summary" placeholder="摘要 / 笔记正文（可选，富文本在加入后编辑）"></textarea>
      <div class="kb-new-form-row">
        <select class="kb-new-cat">
          ${allCategories().map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
        <input class="kb-new-tags" type="text" placeholder="标签，逗号分隔">
      </div>
      <div class="kb-new-hint">填写后点"添加"会在知识库创建一条独立条目，可继续编辑笔记。</div>
      <div class="kb-new-form-row">
        <button class="kb-new-submit">添加</button>
        <button class="kb-new-cancel">取消</button>
      </div>
    </div>
    <div class="kb-list">
      ${count === 0 ? `
        <div class="kb-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <div class="kb-empty-title">知识库为空</div>
          <div class="kb-empty-sub">点右上角 + 主动新建条目<br/>或在资讯卡片上点书签收藏<br/>支持标题与富文本笔记编辑</div>
        </div>
      ` : ''}
    </div>
  `;

  const list = $('.kb-list', root);
  if (!list) return;

  const items = [...STATE.kbItems.entries()].map(([id, stored]) => {
    const newsItem = findItem(id);
    const note = (typeof stored === 'object' && stored) ? (stored.note || '') : (stored || '');
    const customTitle = (typeof stored === 'object' && stored) ? (stored.title || '') : '';
    return { id, newsItem, note, customTitle };
  }).reverse();

  for (const { id, newsItem, note, customTitle } of items) {
    if (!newsItem) {
      // deleted source, but note kept
      list.insertAdjacentHTML('beforeend', `
        <div class="kb-item" data-id="${id}">
          <div class="kb-item-title-edit" contenteditable="true" data-id="${id}" data-field="title">${escapeHtml(customTitle || '已删除的资讯')}</div>
          <div class="kb-toolbar">
            <button class="kb-tool" data-cmd="bold" title="粗体"><b>B</b></button>
            <button class="kb-tool" data-cmd="italic" title="斜体"><i>I</i></button>
            <button class="kb-tool" data-cmd="insertUnorderedList" title="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
            <button class="kb-tool" data-cmd="formatBlock" data-value="blockquote" title="引用"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h2"/><path d="M14 21c3 0 7-1 7-8V5c0-1.25-.756-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h2"/></svg></button>
            <button class="kb-tool" data-cmd="createLink" title="链接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
          </div>
          <div class="kb-item-note-edit" contenteditable="true" data-id="${id}" data-field="note" data-placeholder="添加富文本笔记...">${note}</div>
          <div class="kb-item-footer">
            <button class="kb-item-btn remove" data-remove-id="${id}">移除</button>
          </div>
        </div>
      `);
      continue;
    }

      el.classList.toggle('empty', !el.textContent.trim());

      // e.preventDefault(); const text = (e.clipboardData || window.clipboardData).getData('text'); document.execCommand('insertText', false, text);

    btn.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep selection in the editor

      e.preventDefault();
      const cmd = btn.dataset.cmd;
      const value = btn.dataset.value;
      // Find the active editable in the same kb-item
      const item = btn.closest('.kb-item');
      const editor = $('.kb-item-note-edit', item);
      if (!editor) return;
      editor.focus();
      if (cmd === 'createLink') {
        const url = prompt('输入链接 URL:', 'https://');
        if (url) document.execCommand('createLink', false, url);
      } else if (cmd === 'formatBlock') {
        const cur = document.queryCommandValue('formatBlock');
        // toggle blockquote / pre
        if (cur === value || cur === (value.toLowerCase())) {
          document.execCommand('formatBlock', false, 'div');
        } else {
          document.execCommand('formatBlock', false, value);
        }
      } else {
        document.execCommand(cmd, false, null);

      setTimeout(() => updateToolbarActive(btn), 0);

      editor.dispatchEvent(new Event('input'));

  $$('[data-remove-id]', root).forEach(btn => {

    const catSelect = $('.kb-new-cat', newForm);
    const tagsInput = $('.kb-new-tags', newForm);

    if (fetchBtn) fetchBtn.onclick = async () => {
      const url = (urlInput.value || '').trim();

      fetchBtn.classList.add('spinning');

        const result = await fetchArticle(url, { metaOnly: true });
        if (result.title) titleInput.value = result.title;
        if (result.summary) summaryInput.value = result.summary;
        if (result.source && !titleInput.dataset.filled) titleInput.dataset.filled = '1';
        showToast('已抓取元数据');
      } catch (e) {
        showToast('抓取失败: ' + (e.message || 'CORS 限制') + ' · 可手动填写');
      } finally {
        fetchBtn.classList.remove('spinning');
      }
    };

    const submitBtn = $('.kb-new-submit', newForm);
    if (submitBtn) submitBtn.onclick = () => {
      const title = titleInput.value.trim();
      if (!title) { showToast('标题必填'); titleInput.focus(); return; }
      const url = (urlInput.value || '').trim();
      const summary = summaryInput.value.trim();
      const cat = catSelect.value;
      const tags = tagsInput.value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
      const id = 'manual-' + Date.now().toString(36);
      const item = {
        id, category: cat, title, summary: summary || '（暂无摘要）',
        source: '手动添加', url, tags, publishedAt: fmtDate(new Date().toISOString()),
      };
      STATE.kbItems.set(id, { note: '', title: '', item });
      saveState();
      renderKb();
      renderGrid();
      // clear + hide
      urlInput.value = ''; titleInput.value = ''; summaryInput.value = ''; tagsInput.value = '';
      newForm.classList.remove('show');
      showToast('已添加到知识库');
    };

    const cancelBtn = $('.kb-new-cancel', newForm);
    if (cancelBtn) cancelBtn.onclick = () => {
      newForm.classList.remove('show');
    };
  }
}

/* ============================================================
   Article full text fetcher (with CORS proxy fallback)
   ============================================================ */
const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://r.jina.ai/${url}`, // reader mode (returns clean markdown/text)
];

async function fetchArticle(url, opts) {
  opts = opts || {};
  const errors = [];

  // Try direct fetch first
  try {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (res.ok) {
      const html = await res.text();
      return parseArticleHtml(html, url);
    }
    errors.push(`direct: HTTP ${res.status}`);
  } catch (e) {
    errors.push('direct: ' + (e.message || 'CORS'));
  }

  // Fallback to proxies
  for (const makeProxy of CORS_PROXIES) {
    try {
      const proxyUrl = makeProxy(url);
      const res = await fetch(proxyUrl);
      if (!res.ok) { errors.push(`proxy: HTTP ${res.status}`); continue; }
      const text = await res.text();
      if (makeProxy === CORS_PROXIES[2]) {
        // r.jina.ai returns reader text
        return { title: extractTitleFromText(text), summary: text.slice(0, 200), html: '<pre style="white-space:pre-wrap">' + escapeHtml(text) + '</pre>', source: extractDomain(url) };
      }
      return parseArticleHtml(text, url);
    } catch (e) {
      errors.push('proxy: ' + (e.message || 'fail'));
    }
  }
  throw new Error(errors.join(' | '));
}

function parseArticleHtml(html, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  // Title
  let title = '';
  const ogTitle = doc.querySelector('meta[property="og:title"]');
  if (ogTitle) title = ogTitle.getAttribute('content');
  if (!title) title = doc.querySelector('title')?.textContent || '';
  if (!title) {
    const h1 = doc.querySelector('h1');
    if (h1) title = h1.textContent;
  }
  title = title.trim();

  // Summary / description
  let summary = '';
  const ogDesc = doc.querySelector('meta[property="og:description"]') || doc.querySelector('meta[name="description"]');
  if (ogDesc) summary = ogDesc.getAttribute('content') || '';
  summary = summary.trim().slice(0, 300);

  // Main content - try common article selectors
  const selectors = [
    'article',
    'main [role="main"]',
    'main',
    '.article-content', '.article-body', '.article',
    '.post-content', '.post-body', '.entry-content',
    '.content-body', '.story-body',
    '#article-body', '#article',
    '[itemprop="articleBody"]',
    '.markdown-body', '.rich-text',
  ];
  let articleEl = null;
  for (const sel of selectors) {
    const el = doc.querySelector(sel);
    if (el && el.textContent.trim().length > 200) {
      articleEl = el;
      break;
    }
  }
  if (!articleEl) articleEl = doc.body;

  // Clean: remove scripts, styles, ads, nav, footer
  articleEl.querySelectorAll('script, style, noscript, iframe, nav, footer, header, aside, .ad, .ads, .advertisement, .share, .social, .related, .comments, .sidebar, .newsletter, .subscribe, [aria-hidden="true"]').forEach(n => n.remove());

  // Convert to safe HTML (sanitize)
  let html2 = articleEl.innerHTML;
  // Allow only safe tags
  const allowedTags = 'p,br,h1,h2,h3,h4,h5,h6,ul,ol,li,blockquote,pre,code,em,strong,b,i,a,img,figure,figcaption,table,thead,tbody,tr,td,th,div,span';
  const tmp = document.createElement('div');
  tmp.innerHTML = html2;
  const cleaned = document.createElement('div');
  const allowed = new Set(allowedTags.split(','));
  function walk(src, dst) {
    for (const node of [...src.childNodes]) {
      if (node.nodeType === Node.TEXT_NODE) {
        const t = node.textContent.replace(/\s+/g, ' ').trim();
        if (t) dst.appendChild(document.createTextNode(t + ' '));
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        const tag = node.tagName.toLowerCase();
        if (!allowed.has(tag)) {
          // recurse into blocked element (pull out its text/children)
          walk(node, dst);
          continue;
        }
        const clone = document.createElement(tag);
        // sanitize attributes
        for (const attr of [...node.attributes]) {
          const name = attr.name.toLowerCase();
          if (name === 'href' || name === 'src') {
            try {
              const abs = new URL(attr.value, url).href;
              clone.setAttribute(name, abs);
            } catch (_) {}
          } else if (name === 'alt' || name === 'title' || name === 'class' === false) {
            // keep alt/title only
            if (name === 'alt' || name === 'title') clone.setAttribute(name, attr.value);
          }
        }
        // skip empty paragraphs
        walk(node, clone);
        if (clone.textContent.trim() || tag === 'img' || tag === 'br') {
          dst.appendChild(clone);
        }
      }
    }
  }
  walk(tmp, cleaned);
  // trim excessive empty paragraphs
  cleaned.querySelectorAll('p').forEach(p => {
    if (!p.textContent.trim() && !p.querySelector('img')) p.remove();
  });

  return {
    title,
    summary,
    html: cleaned.innerHTML,
    source: extractDomain(url),
  };
}

function extractTitleFromText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  return lines[0] || '';
}
function extractDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return ''; }
}

let _articleCache = new Map();
async function loadArticleFullText(item, btn) {
  const container = $('#detail-article-container');
  if (!container) return;
  // Toggle off if already loaded
  if (container.dataset.loaded === '1' && container.dataset.loadedFor === item.id) {
    container.innerHTML = '';
    container.dataset.loaded = '0';
    container.dataset.loadedFor = '';
    btn.classList.remove('loading');
    const label = $('.detail-article-toggle-label', btn.parentElement.parentElement) || $('.detail-article-toggle-label', btn);
    if (label) label.textContent = '加载全文';
    return;
  }
  if (btn) { btn.classList.add('loading'); const label = btn.querySelector('.detail-article-toggle-label'); if (label) label.textContent = '加载中...'; }
  container.innerHTML = `<div class="detail-article-loading"><div class="spinner"></div><div>正在抓取原文...</div></div>`;
  try {
    let result = _articleCache.get(item.url);
    if (!result) {
      result = await fetchArticle(item.url);
      _articleCache.set(item.url, result);
    }
    if (result.html && result.html.trim()) {
      container.innerHTML = `<div class="detail-article">${result.html}</div>`;
      container.dataset.loaded = '1';
      container.dataset.loadedFor = item.id;
      if (btn) { btn.classList.remove('loading'); const label = btn.querySelector('.detail-article-toggle-label'); if (label) label.textContent = '收起全文'; }
    } else if (result.summary) {
      container.innerHTML = `<div class="detail-article"><p>${escapeHtml(result.summary)}</p></div>`;
      container.dataset.loaded = '1';
      container.dataset.loadedFor = item.id;
      if (btn) { btn.classList.remove('loading'); const label = btn.querySelector('.detail-article-toggle-label'); if (label) label.textContent = '收起全文'; }
    } else {
      throw new Error('未抓取到正文内容');
    }
  } catch (e) {
    container.innerHTML = `
      <div class="detail-article-error">
        <div><strong>无法在站内加载全文</strong></div>
        <div style="margin-top:6px">原因: ${escapeHtml(e.message || 'CORS 限制或网络问题')}</div>
        <div style="margin-top:8px">该网站禁止跨域抓取。请点击下方"原文"在新标签打开阅读。</div>
      </div>
    `;
    if (btn) { btn.classList.remove('loading'); const label = btn.querySelector('.detail-article-toggle-label'); if (label) label.textContent = '加载全文'; }
  }
}

/* ============================================================
   Sync button (manual incremental fetch)
   ============================================================ */
async function syncIncremental() {
  const btn = $('#sync-btn');
  btn.classList.add('spinning');
  try {
    // Try to fetch news.json again - if updatedAt changed, merge as incremental
    // Also try a separate sync.json if exists
    const candidates = ['./sync.json', 'sync.json', '/sync.json', '/ai-design-daily/sync.json'];
    let data = null;
    for (const p of candidates) {
      try {
        const res = await fetch(p + '?t=' + Date.now());
        if (!res.ok) continue;
        data = await res.json();
        break;
      } catch (_) {}
    }
    if (data && data.items && data.items.length) {
      // Merge: only keep items not already in base data
      const baseIds = new Set((STATE.data && STATE.data.items || []).map(i => i.id));
      const merged = data.items.filter(i => !baseIds.has(i.id));
      if (merged.length > 0) {
        STATE.incremental = { items: merged, updatedAt: data.updatedAt || new Date().toISOString() };
        STATE.lastSyncAt = new Date().toISOString();
        localStorage.setItem('ai-design-daily:last-sync', STATE.lastSyncAt);
        showToast(`同步成功 · 新增 ${merged.length} 条`);
        renderBrandSub();
        renderFilters();
        renderGrid();
      } else {
        showToast('已是最新 · 暂无新增');
      }
    } else {
      // No sync.json — fallback to refetching news.json (which may include new items)
      const refetchPaths = ['./news.json', 'news.json'];
      let refreshed = null;
      for (const p of refetchPaths) {
        try {
          const res = await fetch(p + '?t=' + Date.now());
          if (!res.ok) continue;
          refreshed = await res.json();
          break;
        } catch (_) {}
      }
      if (refreshed && STATE.data) {
        const oldIds = new Set(allItems().map(i => i.id));
        const newOnes = (refreshed.items || []).filter(i => !oldIds.has(i.id));
        if (newOnes.length > 0) {
          STATE.incremental = { items: newOnes, updatedAt: refreshed.updatedAt };
          STATE.lastSyncAt = new Date().toISOString();
          localStorage.setItem('ai-design-daily:last-sync', STATE.lastSyncAt);
          showToast(`同步成功 · 新增 ${newOnes.length} 条`);
          renderBrandSub();
          renderFilters();
          renderGrid();
        } else {
          showToast('已是最新 · 截止上一小时暂无新增');
        }
      } else {
        showToast('暂无可同步的新内容');
      }
    }
  } catch (e) {
    showToast('同步失败: ' + (e.message || '未知错误'));
  } finally {
    btn.classList.remove('spinning');
  }
}
$('#sync-btn').onclick = syncIncremental;

function exportKb() {
  if (STATE.kbItems.size === 0) {
    showToast('知识库为空,无法导出');
    return;
  }
  const exportData = {
    exportedAt: new Date().toISOString(),
    source: 'ai-design-daily',
    items: [...STATE.kbItems.entries()].map(([id, stored]) => {
      const newsItem = findItem(id);
      const note = (typeof stored === 'object' && stored) ? (stored.note || '') : (stored || '');
      const title = (typeof stored === 'object' && stored) ? (stored.title || '') : '';
      return { id, note, customTitle: title, item: newsItem };
    }),
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ai-design-daily-kb-${fmtDate(new Date().toISOString())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 ' + STATE.kbItems.size + ' 条');
}

$('#kb-import-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const items = data.items || data;
      if (!Array.isArray(items)) throw new Error('格式错误');
      let added = 0;
      for (const item of items) {
        if (item.id) {
          const note = item.note || '';
          const title = item.customTitle || item.title || '';
          STATE.kbItems.set(item.id, { note, title, item: item.item || null });
          added++;
        }
      }
      saveState();
      renderKb();
      renderGrid();
      showToast(`已导入 ${added} 条`);
    } catch (err) {
      showToast('导入失败: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   Load data
   ============================================================ */
async function loadData() {
  const grid = $('#grid');
  grid.innerHTML = Array(4).fill('<div class="skeleton-card"></div>').join('');

  const candidates = ['./news.json', 'news.json', '/news.json', '/ai-design-daily/news.json'];
  let data = null;
  let lastErr = null;
  for (const p of candidates) {
    try {
      const res = await fetch(p + '?t=' + Date.now());
      if (!res.ok) continue;
      data = await res.json();
      break;
    } catch (e) { lastErr = e; }
  }
  if (!data) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="empty-title">无法加载资讯数据</div>
        <div class="empty-sub">${escapeHtml((lastErr && lastErr.message) || '请稍后刷新重试')}</div>
      </div>
    `;
    return;
  }
  STATE.data = data;
  renderBrandSub();
  renderUpdateBanner();
  renderFilters();
  renderGrid();
  renderDetail();
  renderKb();
}

loadData();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape') {
    if ($('#kb-drawer').classList.contains('show')) closeKbDrawer();
    else if (STATE.selectedId) {
      STATE.selectedId = null;
      renderGrid();
      renderDetail();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    syncIncremental();
  }
});
</script>
