          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          保存
        </button>
      </div>
    </div>
    <div class="kb-list">
      ${count === 0 ? `
        <div class="kb-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <div class="kb-empty-title">知识库为空</div>
          <div class="kb-empty-sub">点击顶部「+ 新建」创建文档<br/>或在资讯卡片点 🔖 一键保存并解析全文<br/>支持粘贴 URL 自动抓取内容</div>
        </div>
      ` : ''}
    </div>
  `;

  const list = $('.kb-list', root);
  if (!list) return;

  const items = [...STATE.kbItems.entries()].map(([id, stored]) => {
    const newsItem = findItem(id);
    const note = (typeof stored === 'object' && stored) ? (stored.note || '') : (stored || '');
    const customTitle = (typeof stored === 'object' && stored) ? (stored.title || '') : '';
    return { id, newsItem, note, customTitle };
  }).reverse();

  for (const { id, newsItem, note, customTitle } of items) {
    if (!newsItem) {
      // deleted source, but note kept - construct a minimal item
      const minimalItem = {
        id: id,
        title: customTitle || '已删除的资讯',
        summary: '',
        category: 'interaction',
        source: '小记',
        url: '',
        tags: [],
        publishedAt: new Date().toISOString(),
      };
      newsItem = minimalItem;
    }
    // Continue rendering with the item
    const cat = allCategories().find(c => c.id === newsItem.category) || { name: '', color: '#0a84ff' };
    const color = cat.color;
    const isActive = STATE.selectedId === id;
    list.insertAdjacentHTML('beforeend', `
      <div class="kb-item ${isActive ? 'active' : ''}" data-id="${id}" style="--cat-color:${color}">
        <div class="kb-item-meta">
          <span class="cat-tag" style="color:${color}">
            <span class="cat-dot"></span>${cat.name}
          </span>
          <span style="font-size:10px;color:var(--text-tertiary);margin-left:auto">${relDate(newsItem.publishedAt)}</span>
          <button class="kb-item-preview-btn" data-preview-id="${id}" title="在中间预览知识库文档">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            预览
          </button>
        </div>
        <div class="kb-item-title-edit" contenteditable="true" data-id="${id}" data-field="title" style="color:${color}">${escapeHtml(customTitle || newsItem.title)}</div>
        <div class="kb-item-summary">${escapeHtml(newsItem.summary)}</div>
        <div class="kb-toolbar">
          <button class="kb-tool" data-cmd="bold" title="粗体 (⌘B)"><b>B</b></button>
          <button class="kb-tool" data-cmd="italic" title="斜体 (⌘I)"><i>I</i></button>
          <button class="kb-tool" data-cmd="insertUnorderedList" title="无序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <button class="kb-tool" data-cmd="formatBlock" data-value="blockquote" title="引用块"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h2"/><path d="M14 21c3 0 7-1 7-8V5c0-1.25-.756-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h2"/></svg></button>
          <button class="kb-tool" data-cmd="createLink" title="插入链接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
          <button class="kb-tool" data-cmd="formatBlock" data-value="pre" title="代码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
        </div>
        <div class="kb-item-note-edit ${note ? '' : 'empty'}" contenteditable="true" data-id="${id}" data-field="note" data-placeholder="点击这里写笔记 · 支持粗体 / 列表 / 链接 / 引用">${note}</div>
        <div class="kb-item-footer">
          <a class="kb-item-btn open" href="${escapeHtml(newsItem.url || '#')}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            原文
          </a>
          <button class="kb-item-btn remove" data-remove-id="${id}">移除</button>
        </div>
      </div>
    `);
  }

  // Wire KB item interactions
  $$('.kb-item', root).forEach(item => {
    const id = item.dataset.id;
    // Click item (not on interactive) → select news item to show KB preview
    item.addEventListener('click', (e) => {
      if (e.target.closest('.kb-item-title-edit, .kb-item-note-edit, .kb-tool, .kb-item-btn, a, .kb-item-preview-btn')) return;
      const newsItem = findItem(id);
      if (newsItem) selectItem(id, 'kb');
    });
  });

  // Wire preview buttons
  $$('.kb-item-preview-btn', root).forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.previewId;
      const newsItem = findItem(id);
      if (newsItem) {
        // On mobile, open KB drawer first
        if (window.innerWidth < 1280) {
          openKbDrawer();
        }
        STATE.kbPreviewMode = 'kb';
        selectItem(id, 'kb');
        showToast('正在预览知识库文档...');
      }
    });
  });

  // Editable title (single line enter → blur)
  $$('.kb-item-title-edit', root).forEach(el => {
    el.addEventListener('blur', () => saveKbField(el));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });

  // Editable rich text note
  $$('.kb-item-note-edit', root).forEach(el => {
    el.addEventListener('blur', () => {
      saveKbField(el);
      el.classList.toggle('empty', !el.textContent.trim());
    });
    el.addEventListener('input', () => {
      el.classList.toggle('empty', !el.textContent.trim());
    });
    el.addEventListener('paste', (e) => {
      // strip formatting on paste, keep plain text (optional - here we allow rich paste)
      // e.preventDefault(); const text = (e.clipboardData || window.clipboardData).getData('text'); document.execCommand('insertText', false, text);
    });
  });

  // Toolbar buttons → execCommand
  $$('.kb-tool', root).forEach(btn => {
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep selection in the editor
    });
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const cmd = btn.dataset.cmd;
      const value = btn.dataset.value;
      // Find the active editable in the same kb-item
      const item = btn.closest('.kb-item');
      const editor = $('.kb-item-note-edit', item);
      if (!editor) return;
      editor.focus();
      if (cmd === 'createLink') {
        const url = prompt('输入链接 URL:', 'https://');
        if (url) document.execCommand('createLink', false, url);
      } else if (cmd === 'formatBlock') {
        const cur = document.queryCommandValue('formatBlock');
        // toggle blockquote / pre
        if (cur === value || cur === (value.toLowerCase())) {
          document.execCommand('formatBlock', false, 'div');
        } else {
          document.execCommand('formatBlock', false, value);
        }
      } else {
        document.execCommand(cmd, false, null);
      }
      // update active state
      setTimeout(() => updateToolbarActive(btn), 0);
      // save on next blur
      editor.dispatchEvent(new Event('input'));
    });
  });

  // Remove buttons
  $$('[data-remove-id]', root).forEach(btn => {
    btn.onclick = () => {
      STATE.kbItems.delete(btn.dataset.removeId);
      saveState();
      renderKb();
      renderGrid();
      renderDetail();
      showToast('已从知识库移除');
    };
  });

  // Export / import
  const exportBtn = $('.kb-export', root);
  if (exportBtn) exportBtn.onclick = exportKb;
  const importBtn = $('.kb-import', root);
  if (importBtn) importBtn.onclick = () => $('#kb-import-input').click();

  // New document editor
  const newBtn = $('.kb-create-btn', root);
  const docEditor = $('.kb-doc-editor', root);
  const docClose = $('.kb-doc-close', root);
  const docUrlInput = $('.kb-doc-url-input', root);
  const docFetchBtn = $('.kb-doc-fetch-btn', root);
  const docTitle = $('.kb-doc-title', root);
  const docContent = $('.kb-doc-content', root);
  const docCat = $('.kb-doc-cat', root);
  const docTags = $('.kb-doc-tags', root);
  const docSave = $('.kb-doc-save', root);

  function openDocEditor(prefill) {
    prefill = prefill || {};
    docEditor.classList.add('show');
    docUrlInput.value = prefill.url || '';
    docTitle.value = prefill.title || '';
    docContent.innerHTML = '';
    if (prefill.content) {
      docContent.innerHTML = prefill.content;
    } else if (prefill.autoFetch) {
      // Show loading placeholder while fetching, but also pre-populate with summary
      const summaryHtml = prefill.summary ? 
        '<p style="color:var(--text-tertiary);font-size:12px;">原文摘要：</p><p>' + escapeHtml(prefill.summary) + '</p><p></p>' : '';
      docContent.innerHTML = summaryHtml + '<p style="color:var(--text-tertiary);font-style:italic;">正在抓取全文...</p>';
    } else if (prefill.summary) {
      docContent.innerHTML = '<p>' + escapeHtml(prefill.summary) + '</p><p></p>';
    }
    docCat.value = prefill.category || 'interaction';
    docTags.value = prefill.tags || '';
    if (prefill.url) {
      docUrlInput.value = prefill.url;
    }
    if (prefill.sourceUrl) {
      docUrlInput.value = prefill.sourceUrl;
    }
    // Auto-trigger fetch if needed
    if (prefill.autoFetch && prefill.url && isLikelyUrl(prefill.url)) {
      showToast('正在抓取全文...');
      autoFetchUrl(prefill.url, docTitle, docContent, docFetchBtn);
    }
    setTimeout(() => docTitle.focus(), 50);
  }
  // Store on panel for external access (used by openEditorForArticle)
  root._openDocEditor = openDocEditor;
  function closeDocEditor() {
    docEditor.classList.remove('show');
  }

  if (newBtn) newBtn.onclick = () => openDocEditor({});
  if (docClose) docClose.onclick = closeDocEditor;

  // URL auto-detect: when user pastes a URL, auto-fetch
  if (docUrlInput) {
    docUrlInput.addEventListener('paste', (e) => {
      setTimeout(() => {
        const url = docUrlInput.value.trim();
        if (isLikelyUrl(url)) {
          autoFetchUrl(url, docTitle, docContent, docFetchBtn);
        }
      }, 50);
    });
    docUrlInput.addEventListener('change', () => {
      const url = docUrlInput.value.trim();
      if (isLikelyUrl(url) && docContent.innerHTML.replace(/<[^>]*>/g, '').trim().length < 20) {
        autoFetchUrl(url, docTitle, docContent, docFetchBtn);
      }
    });
  }

  if (docFetchBtn) docFetchBtn.onclick = () => {
    const url = docUrlInput.value.trim();
    if (!url) { showToast('请先输入 URL'); return; }
    autoFetchUrl(url, docTitle, docContent, docFetchBtn);
  };

  // Rich text toolbar
  $$('.kb-doc-tool', docEditor).forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      const cmd = btn.dataset.cmd;
      const val = btn.dataset.value || null;
      if (cmd === 'createLink') {
        const url = prompt('输入链接地址:', 'https://');
        if (url) document.execCommand('createLink', false, url);
      } else if (cmd) {
        document.execCommand(cmd, false, val);
      }
      docContent.focus();
    };
  });

  // Paste handler in content area: detect URLs and optionally fetch
  if (docContent) {
    docContent.addEventListener('paste', (e) => {
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (text && isLikelyUrl(text.trim())) {
        // Let paste happen, then auto-fetch
        setTimeout(() => {
          const url = text.trim();
          docUrlInput.value = url;
          autoFetchUrl(url, docTitle, docContent, docFetchBtn);
        }, 100);
      }
    });
  }

  if (docSave) docSave.onclick = () => {
    const title = docTitle.value.trim();
    if (!title) { showToast('标题不能为空'); docTitle.focus(); return; }
    const contentHTML = docContent.innerHTML;
    const contentText = docContent.textContent.trim();
    const url = docUrlInput.value.trim();
    const cat = docCat.value;
    const tags = docTags.value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    const id = 'doc-' + Date.now().toString(36);
    const item = {
      id, category: cat, title,
      summary: contentText.slice(0, 200) || '（暂无内容）',
      source: url ? extractDomain(url) || '小记' : '小记',
      url, tags, publishedAt: fmtDate(new Date().toISOString()),
    };
    STATE.kbItems.set(id, { note: contentHTML, title: '', item });
    // Add to data so it can be found by findItem
    if (STATE.data && STATE.data.items) {
      STATE.data.items.unshift(item);
    }
    saveState();
    renderKb();
    renderGrid();
    // Switch to KB preview mode to show the new document
    STATE.selectedId = id;
    STATE.kbPreviewMode = 'kb';
    renderDetail();
    showToast('已保存到知识库');
    closeDocEditor();
  };

  // Note: KB_PREFILL mechanism removed; openEditorForArticle now directly
  // calls panel._openDocEditor() after renderKb() completes.
}

/* ============================================================
   URL helpers + article text extractor
   ============================================================ */
function isLikelyUrl(str) {
  return /^https?:\/\//i.test(str.trim());
}

async function autoFetchUrl(url, titleEl, contentEl, fetchBtn) {
  if (fetchBtn) fetchBtn.classList.add('spinning');
  try {
    const result = await fetchArticleFull(url);
    if (result.title && titleEl && !titleEl.value.trim()) {
      titleEl.value = result.title;
    }
    if (result.html && contentEl) {
      // Only overwrite if content is basically empty (loading placeholder)
      const existingText = contentEl.textContent.trim();
      if (existingText.length < 30) {
        contentEl.innerHTML = result.html;
      } else {
        // Append as a new section
        const wrapper = document.createElement('div');
        wrapper.innerHTML = result.html;
        contentEl.appendChild(wrapper);
      }
      showToast('已抓取全文 · 可继续编辑');
    } else if (result.text && contentEl) {
      contentEl.textContent = result.text;
      showToast('已抓取文本内容');
    } else {
      // No content returned - clear loading placeholder
      if (contentEl && contentEl.textContent.trim().length < 30) {
        contentEl.innerHTML = '<p style="color:var(--text-tertiary);font-style:italic;">未能获取到内容，请手动编辑或尝试其他 URL</p>';
      }
      showToast('未能解析该页面内容');
    }
  } catch (e) {
    // If fetch fails, replace loading placeholder but preserve any existing content
    if (contentEl) {
      const html = contentEl.innerHTML;
      // Check if the loading message is still there (meaning fetch didn't get any content)
      if (html.includes('正在抓取全文') || html.includes('加载中')) {
        // Replace loading message with a note, but keep any pre-populated summary
        const cleaned = html
          .replace(/<p[^>]*>正在抓取全文<\/p>/g, '')
          .replace(/<p[^>]*>加载中\.\.\.<\/p>/g, '')
          .trim();
        contentEl.innerHTML = cleaned + 
          (cleaned ? '<p></p>' : '') + 
          '<p style="color:var(--text-tertiary);font-style:italic;">抓取失败 · 可手动粘贴内容或点击"抓取"重试</p>';
      }
    }
    showToast('抓取失败: ' + (e.message || '网络错误').slice(0, 50));
  } finally {
    if (fetchBtn) fetchBtn.classList.remove('spinning');
  }
}

async function fetchArticleFull(url) {
  // List of CORS proxies to try, in order of preference
  const proxies = [
    // 1. jina.ai reader mode - best quality markdown
    { url: 'https://r.jina.ai/' + url, parser: 'jina' },
    // 2. allorigins - full HTML fetch
    { url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url), parser: 'html' },
    // 3. codetabs
    { url: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), parser: 'html' },
    // 4. corsproxy.io
    { url: 'https://corsproxy.io/?url=' + encodeURIComponent(url), parser: 'text' },
    // 5. CORS.sh
    { url: 'https://proxy.cors.sh/' + url, parser: 'html' },
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const res = await fetch(proxy.url, { signal: controller.signal });
      clearTimeout(timeoutId);
      
      if (!res.ok) continue;
      
      const text = await res.text();
      if (!text || text.length < 100) continue;

      if (proxy.parser === 'jina') {
        // jina returns markdown-like text
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        const title = lines[0] || '';
        const html = text
          .replace(/^# (.+)$/gm, '<h3>$1</h3>')
          .replace(/^## (.+)$/gm, '<h4>$1</h4>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/^- (.+)$/gm, '<li>$1</li>')
          .replace(/\n\n+/g, '</p><p>')
          .replace(/\n/g, '<br>');
        return { title, html: '<p>' + html + '</p>', text };
      }

      if (proxy.parser === 'html') {
        // HTML parsing proxies
        const doc = new DOMParser().parseFromString(text, 'text/html');
        let title = '';
        const ogTitle = doc.querySelector('meta[property="og:title"]');
        if (ogTitle) title = ogTitle.getAttribute('content');
        if (!title) title = doc.querySelector('title')?.textContent || '';
        if (!title) { const h1 = doc.querySelector('h1'); if (h1) title = h1.textContent; }
        title = title.trim();

        const selectors = ['article', 'main', '.article-content', '.entry-content', '.post-content', 'main[role="main"]', '.content', '#content', 'article[itemprop="articleBody"]'];
        let article = null;
        for (const sel of selectors) {
          article = doc.querySelector(sel);
          if (article && article.textContent.trim().length > 200) break;
        }
        if (!article) article = doc.body;

        article.querySelectorAll('script,style,nav,footer,aside,.ad,.comments,.sidebar,.newsletter').forEach(n => n.remove());

        const allowed = new Set(['p','h1','h2','h3','h4','h5','h6','ul','ol','li','blockquote','pre','code','em','strong','b','i','a','img','br','div','span','figure','figcaption','table','thead','tbody','tr','td','th']);
        function sanitize(src) {
          const dst = document.createElement('div');
          for (const node of src.childNodes) {
            if (node.nodeType === Node.TEXT_NODE) {
              const t = node.textContent.replace(/\s+/g, ' ').trim();
              if (t) dst.appendChild(document.createTextNode(t + ' '));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
              const tag = node.tagName.toLowerCase();
              if (!allowed.has(tag)) { sanitize(node, dst); continue; }
              const clone = document.createElement(tag);
              for (const attr of node.attributes) {
                const name = attr.name.toLowerCase();
                if (name === 'href' || name === 'src') {
                  try { clone.setAttribute(name, new URL(attr.value, url).href); } catch (_) {}
                } else if (name === 'alt' || name === 'title') {
                  clone.setAttribute(name, attr.value);
                }
              }
              sanitize(node, clone);
              if (clone.textContent.trim() || tag === 'img' || tag === 'br') dst.appendChild(clone);
            }
          }
          return dst.innerHTML;
        }
        const cleanHtml = sanitize(article);
        if (cleanHtml && cleanHtml.length > 100) {
          return { title, html: cleanHtml, text: article.textContent };
        }
      }

      if (proxy.parser === 'text') {
        // Simple text proxy
        return { title: '', html: '<p>' + escapeHtml(text.slice(0, 5000)) + '</p>', text };
      }
    } catch (_) {
      // Try next proxy
      continue;
    }
  }

  throw new Error('无法抓取该 URL 的内容');
}

function extractDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return ''; }
}

/* ============================================================
   Article iframe preview + copy to clipboard
   ============================================================ */
function toggleIframePreview(item, btn) {
  const container = $('#detail-iframe-container');
  if (!container) return;
  // Toggle off
  if (container.dataset.loaded === '1' && container.dataset.loadedFor === item.id) {
    container.innerHTML = '';
    container.dataset.loaded = '0';
    container.dataset.loadedFor = '';
    const label = btn.querySelector('span');
    if (label) label.textContent = '预览原文';
    btn.classList.remove('active');
    return;
  }
  // Show iframe
  container.innerHTML = `
    <div class="detail-iframe-wrap">
      <iframe
        src="${escapeHtml(item.url)}"
        loading="lazy"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        allowfullscreen></iframe>
      <div class="detail-iframe-hint">
        若页面空白，说明该站点禁止 iframe 嵌入。
        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" style="color:var(--accent)">在新标签打开 ↗</a>
      </div>
    </div>
  `;
  container.dataset.loaded = '1';
  container.dataset.loadedFor = item.id;
  const label = btn.querySelector('span');
  if (label) label.textContent = '收起预览';
  btn.classList.add('active');
}

async function copySummaryToClipboard(item) {
  const text = `${item.title}\n\n${item.summary}\n\n来源: ${item.source || '未知'}${item.url ? '\n链接: ' + item.url : ''}`;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showToast('已复制摘要到剪贴板 · 可粘贴到知识库');
    } else {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制摘要 · 可粘贴到知识库');
    }
  } catch (e) {
    showToast('复制失败: ' + (e.message || ''));
  }
}

async function copyArticleToClipboard(item) {
  // Try to fetch via proxy and copy
  const text = await fetchAndExtractText(item.url);
  if (text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast('已复制正文到剪贴板');
    } catch (_) {
      showToast('复制失败');
    }
  }
}

async function fetchAndExtractText(url) {
  const errors = [];
  // Try r.jina.ai first (reader mode)
  try {
    const res = await fetch('https://r.jina.ai/' + url);
    if (res.ok) {
      const text = await res.text();
      if (text && text.trim().length > 50) return text;
    }
    errors.push('jina: HTTP ' + res.status);
  } catch (e) { errors.push('jina: ' + (e.message || '')); }

  // Try allorigins
  try {
    const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
    if (res.ok) {
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script, style, nav, footer, aside, .ad, .comments').forEach(n => n.remove());
      const article = doc.querySelector('article, .article-content, .entry-content, main') || doc.body;
      const text = article.innerText;
      if (text && text.trim().length > 100) return text;
    }
    errors.push('allorigins: HTTP ' + res.status);
  } catch (e) { errors.push('allorigins: ' + (e.message || '')); }

  return null;
}

function updateToolbarActive(btn) {
  // simple state reflection
  const item = btn.closest('.kb-item');
  const tools = $$('.kb-tool', item);
  tools.forEach(t => {
    try {
      if (t.dataset.cmd && document.queryCommandState(t.dataset.cmd)) t.classList.add('active');
      else t.classList.remove('active');
    } catch (_) {}
  });
}

function saveKbField(el) {
  const id = el.dataset.id;
  const field = el.dataset.field;
  const value = el.innerHTML;
  let stored = STATE.kbItems.get(id);
  if (typeof stored !== 'object' || stored === null) stored = { note: stored || '' };
  if (field === 'title') stored.title = value.trim();
  else if (field === 'note') stored.note = value;
  STATE.kbItems.set(id, stored);
  saveState();
}

function renderKb() {
  renderKbPanel($('#kb-panel-pc'));
  renderKbPanel($('#kb-panel-mobile'));
}

/* ============================================================
   Actions
   ============================================================ */
function toggleRead(id) {
  if (STATE.readItems.has(id)) {
    STATE.readItems.delete(id);
  } else {
    STATE.readItems.add(id);
    showToast('已标记为已读');
  }
  saveState();
  renderGrid();
  renderDetail();
}

// Global prefill state for KB editor (used by openEditorForArticle)
let KB_PREFILL = null;

/**
 * Open the KB document editor pre-filled with an article's data.
 * This is the main entry point for "加入知识库" → DingTalk-style new document flow.
 */
function openEditorForArticle(item) {
  if (!item) return;

  // 1. Ensure KB panel is visible (mobile drawer or scroll on PC)
  if (window.innerWidth < 1280) {
    openKbDrawer();  // This calls renderKb() internally, which sets up _openDocEditor
  } else {
    const col = $('.kb-col');
    if (col) col.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // On PC, renderKb() may not have been called yet if KB was never interacted with
    renderKb();
  }

  // 2. Set the selected item and switch to KB preview mode
  STATE.selectedId = item.id;
  STATE.kbPreviewMode = 'kb';
  renderGrid();
  renderDetail();

  // 3. After render, find the visible panel and call its openDocEditor
  setTimeout(() => {
    // Find the visible KB panel
    const pcPanel = $('#kb-panel-pc');
    const mobilePanel = $('#kb-panel-mobile');
    let panel = null;
    
    // Check which panel is visible
    if (pcPanel && pcPanel.offsetParent !== null) {
      panel = pcPanel;
    } else if (mobilePanel && mobilePanel.offsetParent !== null) {
      panel = mobilePanel;
    } else if (mobilePanel && $('#kb-drawer').classList.contains('show')) {
      panel = mobilePanel;
    }
    
    if (!panel) {
      console.warn('[openEditorForArticle] No visible KB panel found');
      return;
    }
    
    // Use the panel's stored openDocEditor function
    if (panel._openDocEditor) {
      panel._openDocEditor({
        url: item.url || '',
        title: item.title || '',
        summary: item.summary || '',
        category: item.category || 'interaction',
        autoFetch: !!(item.url && isLikelyUrl(item.url)),
      });
    } else {
      console.warn('[openEditorForArticle] panel._openDocEditor not found for', panel.id);
    }
  }, 150);
}

function toggleKb(id) {
  const item = findItem(id);
  if (!item) return;
  if (STATE.kbItems.has(id)) {
    STATE.kbItems.delete(id);
    showToast('已移出知识库');
  } else {
    // store both note (empty) + item snapshot for cross-device export
    STATE.kbItems.set(id, { note: '', title: '', item: item });
    showToast('已加入知识库 · 可在右侧编辑');
  }
  saveState();
  renderGrid();
  renderKb();
  renderDetail();
}

function markAllRead() {
  if (!STATE.data) return;
  const all = allItems();
  all.forEach(i => STATE.readItems.add(i.id));
  STATE.lastViewedDate = STATE.data.date;
  localStorage.setItem('ai-design-daily:last-viewed', STATE.lastViewedDate);
  saveState();
  renderUpdateBanner();
  renderGrid();
  showToast('已全部标记为已读');
}

/* ============================================================
   Search
   ============================================================ */
const searchInput = $('#search-input');
const searchClear = $('#search-clear');
searchInput.addEventListener('input', (e) => {
  STATE.query = e.target.value;
  searchClear.classList.toggle('show', !!STATE.query);
  renderGrid();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  STATE.query = '';
  searchClear.classList.remove('show');
  renderGrid();
  searchInput.focus();
});

/* ============================================================
   Sync button (manual incremental fetch)
   ============================================================ */
async function syncIncremental() {
  const btn = $('#sync-btn');
  btn.classList.add('spinning');
  try {
    // Try to fetch news.json again - if updatedAt changed, merge as incremental
    // Also try a separate sync.json if exists
    const candidates = ['./sync.json', 'sync.json', '/sync.json', '/ai-design-daily/sync.json'];
    let data = null;
    for (const p of candidates) {
      try {
        const res = await fetch(p + '?t=' + Date.now());
        if (!res.ok) continue;
        data = await res.json();
        break;
      } catch (_) {}
    }
    if (data && data.items && data.items.length) {
      // Merge: only keep items not already in base data
      const baseIds = new Set((STATE.data && STATE.data.items || []).map(i => i.id));
      const merged = data.items.filter(i => !baseIds.has(i.id));
      if (merged.length > 0) {
        STATE.incremental = { items: merged, updatedAt: data.updatedAt || new Date().toISOString() };
        STATE.lastSyncAt = new Date().toISOString();
        localStorage.setItem('ai-design-daily:last-sync', STATE.lastSyncAt);
        showToast(`同步成功 · 新增 ${merged.length} 条`);
        renderBrandSub();
        renderDateBar();
        renderFilters();
        renderGrid();
      } else {
        showToast('已是最新 · 暂无新增');
      }
    } else {
      // No sync.json — fallback to refetching news.json (which may include new items)
      const refetchPaths = ['./news.json', 'news.json'];
      let refreshed = null;
      for (const p of refetchPaths) {
        try {
          const res = await fetch(p + '?t=' + Date.now());
          if (!res.ok) continue;
          refreshed = await res.json();
          break;
        } catch (_) {}
      }
      if (refreshed && STATE.data) {
        const oldIds = new Set(allItems().map(i => i.id));
        const newOnes = (refreshed.items || []).filter(i => !oldIds.has(i.id));
        if (newOnes.length > 0) {
          STATE.incremental = { items: newOnes, updatedAt: refreshed.updatedAt };
          STATE.lastSyncAt = new Date().toISOString();
          localStorage.setItem('ai-design-daily:last-sync', STATE.lastSyncAt);
          showToast(`同步成功 · 新增 ${newOnes.length} 条`);
          renderBrandSub();
          renderDateBar();
          renderFilters();
          renderGrid();
        } else {
          showToast('已是最新 · 截止上一小时暂无新增');
        }
      } else {
        showToast('暂无可同步的新内容');
      }
    }
  } catch (e) {
    showToast('同步失败: ' + (e.message || '未知错误'));
  } finally {
    btn.classList.remove('spinning');
  }
}
$('#sync-btn').onclick = syncIncremental;

/* ============================================================
   Mobile KB drawer
   ============================================================ */
function openKbDrawer() {
  $('#kb-overlay').classList.add('show');
  $('#kb-drawer').classList.add('show');
  $('#kb-drawer').setAttribute('aria-hidden', 'false');
  renderKb();
}
function closeKbDrawer() {
  $('#kb-overlay').classList.remove('show');
  $('#kb-drawer').classList.remove('show');
  $('#kb-drawer').setAttribute('aria-hidden', 'true');
}
$('#open-kb').onclick = () => {
  // On large screens KB is already visible in right column - just scroll to it
  if (window.innerWidth >= 1280) {
    const col = $('.kb-col');
    if (col) col.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  openKbDrawer();
};
$('#fab-kb').onclick = openKbDrawer;
$('#kb-overlay').onclick = closeKbDrawer;

/* ============================================================
   KB import / export
   ============================================================ */
function exportKb() {
  if (STATE.kbItems.size === 0) {
    showToast('知识库为空,无法导出');
    return;
  }
  const exportData = {
    exportedAt: new Date().toISOString(),
    source: 'ai-design-daily',
    items: [...STATE.kbItems.entries()].map(([id, stored]) => {
      const newsItem = findItem(id);
      const note = (typeof stored === 'object' && stored) ? (stored.note || '') : (stored || '');
      const title = (typeof stored === 'object' && stored) ? (stored.title || '') : '';
      return { id, note, customTitle: title, item: newsItem };
    }),
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ai-design-daily-kb-${fmtDate(new Date().toISOString())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 ' + STATE.kbItems.size + ' 条');
}

$('#kb-import-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const items = data.items || data;
      if (!Array.isArray(items)) throw new Error('格式错误');
      let added = 0;
      for (const item of items) {
        if (item.id) {
          const note = item.note || '';
          const title = item.customTitle || item.title || '';
          STATE.kbItems.set(item.id, { note, title, item: item.item || null });
          added++;
        }
      }
      saveState();
      renderKb();
      renderGrid();
      showToast(`已导入 ${added} 条`);
    } catch (err) {
      showToast('导入失败: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   Load data
   ============================================================ */
async function loadData() {
  const grid = $('#grid');
  grid.innerHTML = Array(4).fill('<div class="skeleton-card"></div>').join('');

  const candidates = ['./news.json', 'news.json', '/news.json', '/ai-design-daily/news.json'];
  let data = null;
  let lastErr = null;
  for (const p of candidates) {
    try {
      const res = await fetch(p + '?t=' + Date.now());
      if (!res.ok) continue;
      data = await res.json();
      break;
    } catch (e) { lastErr = e; }
  }
  if (!data) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="empty-title">无法加载资讯数据</div>
        <div class="empty-sub">${escapeHtml((lastErr && lastErr.message) || '请稍后刷新重试')}</div>
      </div>
    `;
    return;
  }
  STATE.data = data;
  renderBrandSub();
  renderDateBar();
  renderUpdateBanner();
  renderFilters();
  renderGrid();
  renderDetail();
  renderKb();
}

loadData();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape') {
    if ($('#kb-drawer').classList.contains('show')) closeKbDrawer();
    else if (STATE.selectedId) {
      STATE.selectedId = null;
      renderGrid();
      renderDetail();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    syncIncremental();
  }
});
</script>
