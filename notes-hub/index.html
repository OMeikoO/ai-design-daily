<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标注笔记库 · 软考高项</title>
<style>
  :root {
    --bg: #f6f7fb; --bg-elev: #fff; --text: #1f2329; --text-muted: #8a919f;
    --border: #e5e7eb; --brand: #4b3fe3; --brand-soft: rgba(75,63,227,.08);
    --shadow: 0 4px 18px rgba(20,24,40,.08);
  }
  [data-theme="dark"] {
    --bg: #14161c; --bg-elev: #1d2027; --text: #e8eaed; --text-muted: #8a919f;
    --border: #2c2f38; --brand: #7b74ff; --brand-soft: rgba(123,116,255,.12);
    --shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--bg-elev); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; }
  header h1 small { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .search-wrap { flex: 1; min-width: 160px; position: relative; }
  #searchBox {
    width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
  }
  #searchBox:focus { border-color: var(--brand); }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: .6;
  }
  .btn {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
    border-radius: 9px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn:hover { border-color: var(--brand); }
  .chips { display: flex; gap: 8px; padding: 10px 20px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg-elev); position: sticky; top: 49px; z-index: 99; }
  .chip {
    border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; font-size: 12px;
    cursor: pointer; background: var(--bg-elev); color: var(--text); display: flex; gap: 6px; align-items: center;
  }
  .chip.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .chip .cnt { color: var(--text-muted); font-size: 11px; }
  .chip.active .cnt { color: var(--brand); }
  .chip .del { color: #f03e3e; font-weight: 700; margin-left: 2px; }
  .chips .divider { width: 1px; height: 18px; background: var(--border); }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  .note-card {
    display: flex; gap: 14px; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .note-card img.thumb {
    width: 190px; max-height: 130px; object-fit: contain; border: 1px solid var(--border);
    border-radius: 8px; cursor: zoom-in; background: #fff; flex-shrink: 0;
  }
  .note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .note-meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--text-muted); flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .badge { background: var(--brand-soft); color: var(--brand); border-radius: 5px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
  .note-text { font-size: 14px; line-height: 1.7; word-break: break-word; }
  .hl { background: #ffe066; border-radius: 2px; padding: 0 1px; }
  .note-comment {
    background: #fff8d6; border: 1px solid #f0e2a0; border-radius: 8px; padding: 7px 10px;
    font-size: 13px; line-height: 1.6; color: #5c5200; white-space: pre-wrap; word-break: break-word;
  }
  [data-theme="dark"] .note-comment { background: #33301c; border-color: #5a5327; color: #f5e9b8; }
  .note-comment::before { content: "💬 批注 · "; font-size: 11px; opacity: .75; }
  .group-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
  .group-title::before { content: ""; width: 4px; height: 14px; background: var(--brand); border-radius: 2px; }
  .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; }
  .empty .big { font-size: 44px; margin-bottom: 12px; }
  .empty .steps { text-align: left; display: inline-block; margin-top: 14px; line-height: 2.1; font-size: 13.5px; }
  .empty .steps b { color: var(--brand); }
  /* 上传进度 */
  .upload-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 300; padding: 14px 20px;
    background: var(--bg-elev); border-bottom: 1px solid var(--border); display: none;
  }
  .upload-bar .row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .upload-bar .track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .upload-bar .fill { height: 100%; background: var(--brand); width: 0; transition: width .2s; }
  /* 拖拽遮罩 */
  .drop-mask {
    position: fixed; inset: 0; z-index: 400; background: rgba(75,63,227,.12); display: none;
    align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: var(--brand);
  }
  .drop-mask.show { display: flex; }
  /* 大图查看 */
  .lightbox { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; cursor: zoom-out; padding: 30px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92%; max-height: 92%; border-radius: 8px; background: #fff; }
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 600;
    background: #2c2f38; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    display: none; box-shadow: 0 6px 24px rgba(0,0,0,.3); max-width: 80vw;
  }
  @media (max-width: 640px) {
    .note-card { flex-direction: column; }
    .note-card img.thumb { width: 100%; max-height: 150px; }
    .chips { top: 97px; }
  }
</style>
</head>
<body>
<header>
  <h1>标注笔记库<small>在你顺手的 PDF 阅读器里标注 → 上传 → 自动归档</small></h1>
  <div class="search-wrap"><input id="searchBox" placeholder="搜索笔记内容 / 批注 / 书名…"></div>
  <button class="btn" id="btnTheme" title="深色模式">🌙</button>
  <button class="btn primary" id="btnUpload">＋ 上传已标注的 PDF</button>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
</header>

<div class="chips" id="docChips"></div>
<div class="chips" id="typeChips"></div>

<div class="upload-bar" id="uploadBar">
  <div class="row"><span id="upName"></span><span id="upPct"></span></div>
  <div class="track"><div class="fill" id="upFill"></div></div>
</div>
<div class="drop-mask" id="dropMask">松手即可上传 📥</div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<main id="list"></main>

<script>
const $ = (id) => document.getElementById(id);
const S = { docs: [], filterDoc: 'all', filterType: 'all', q: '' };

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3200);
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function markHit(text) {
  const q = S.q.trim();
  const esc = escapeHtml(text);
  if (!q) return esc;
  try {
    return esc.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<span class="hl">${m}</span>`);
  } catch (e) { return esc; }
}

/* ---------- 数据 ---------- */
async function refresh() {
  try { S.docs = await (await fetch('/api/all')).json(); }
  catch (e) { S.docs = []; }
  renderChips();
  renderList();
}

function visibleNotes() {
  const out = [];
  const q = S.q.trim().toLowerCase();
  for (const d of S.docs) {
    if (S.filterDoc !== 'all' && S.filterDoc !== d.id) continue;
    for (const n of d.notes || []) {
      if (S.filterType !== 'all' && S.filterType !== n.type) continue;
      if (q) {
        const hay = `${n.text}\n${n.comment}\n${d.name}\n${n.author}`.toLowerCase();
        if (!hay.includes(q)) continue;
      }
      out.push({ ...n, docName: d.name, docId: d.id });
    }
  }
  return out;
}

/* ---------- 渲染 ---------- */
function renderChips() {
  const total = S.docs.reduce((s, d) => s + d.noteCount, 0);
  let h = `<span class="chip ${S.filterDoc === 'all' ? 'active' : ''}" data-doc="all">📚 全部 <span class="cnt">${total}</span></span>`;
  for (const d of S.docs) {
    h += `<span class="chip ${S.filterDoc === d.id ? 'active' : ''}" data-doc="${d.id}">
      ${escapeHtml(d.name.length > 14 ? d.name.slice(0, 14) + '…' : d.name)} <span class="cnt">${d.noteCount}</span>
      <span class="del" data-del="${d.id}" title="删除此书的笔记">✕</span></span>`;
  }
  $('docChips').innerHTML = h;
  $('docChips').querySelectorAll('.chip').forEach(c => {
    c.onclick = (e) => {
      if (e.target.dataset.del) return;
      S.filterDoc = c.dataset.doc; renderChips(); renderList();
    };
  });
  $('docChips').querySelectorAll('[data-del]').forEach(x => x.onclick = async (e) => {
    e.stopPropagation();
    const d = S.docs.find(v => v.id === x.dataset.del);
    if (!confirm(`删除「${d?.name}」的全部笔记和原文件？`)) return;
    await fetch(`/api/docs/${x.dataset.del}`, { method: 'DELETE' });
    if (S.filterDoc === x.dataset.del) S.filterDoc = 'all';
    showToast('已删除'); refresh();
  });

  const types = new Map();
  for (const d of S.docs) for (const n of d.notes || []) types.set(n.type, (types.get(n.type) || 0) + 1);
  let t = `<span class="chip ${S.filterType === 'all' ? 'active' : ''}" data-type="all">全部类型</span>`;
  for (const [name, cnt] of types) {
    t += `<span class="chip ${S.filterType === name ? 'active' : ''}" data-type="${escapeHtml(name)}">${escapeHtml(name)} <span class="cnt">${cnt}</span></span>`;
  }
  $('typeChips').innerHTML = t;
  $('typeChips').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    S.filterType = c.dataset.type; renderChips(); renderList();
  });
}

function renderList() {
  const list = $('list');
  const notes = visibleNotes();
  if (!S.docs.length) {
    list.innerHTML = `<div class="empty"><div class="big">📥</div>
      还没有笔记。工作流：<div class="steps">
      <b>①</b> 在你顺手的 PDF 阅读器里阅读并标注<br>
      <b>&nbsp;</b>（手机/电脑的 Adobe、WPS、Edge、Notability 等均可，<br>
      <b>&nbsp;</b>&nbsp;标注会直接存进 PDF 文件）<br>
      <b>②</b> 保存后把 PDF 拖进本页或点右上角上传<br>
      <b>③</b> 程序自动提取全部高亮/下划线/便签并归档</div></div>`;
    return;
  }
  if (!notes.length) {
    list.innerHTML = `<div class="empty"><div class="big">🔍</div>没有匹配的笔记<br><span style="font-size:12px">换个关键词，或清除筛选</span></div>`;
    return;
  }
  let h = '', lastDoc = '';
  for (const n of notes) {
    if (n.docName !== lastDoc) {
      lastDoc = n.docName;
      h += `<div class="group-title">${escapeHtml(n.docName)}</div>`;
    }
    const isNoteType = n.type === '便签' || n.type === '文字框';
    const mainText = isNoteType ? (n.comment || '') : n.text;
    const comment = (!isNoteType && n.comment && n.comment !== n.text) ? n.comment : '';
    h += `<div class="note-card">
      ${n.thumb ? `<img class="thumb" loading="lazy" src="/api/docs/${n.docId}/thumb/${n.thumb}.png" data-big="${n.thumb}">` : ''}
      <div class="note-body">
        <div class="note-meta">
          <span class="dot" style="background:${n.color || '#ccc'}; border:1px solid rgba(0,0,0,.15)"></span>
          <span class="badge">${escapeHtml(n.type)}</span>
          <span>第 ${n.page} 页</span>
          ${n.date ? `<span>${escapeHtml(n.date)}</span>` : ''}
          ${n.author && n.author !== '未知' ? `<span>✍️ ${escapeHtml(n.author)}</span>` : ''}
        </div>
        ${mainText ? `<div class="note-text">${markHit(mainText)}</div>` : ''}
        ${comment ? `<div class="note-comment">${markHit(comment)}</div>` : ''}
      </div>
    </div>`;
  }
  list.innerHTML = h;
  list.querySelectorAll('img.thumb').forEach(img => img.onclick = () => {
    $('lightboxImg').src = img.src;
    $('lightbox').classList.add('show');
  });
}

/* ---------- 上传（4MB 分片，预览代理对大请求不友好） ---------- */
async function uploadFile(file) {
  if (!file.name.toLowerCase().endsWith('.pdf')) { showToast('仅支持 PDF 文件'); return; }
  const uid = crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Date.now() + '' + Math.random().toString(16).slice(2);
  const total = Math.max(1, Math.ceil(file.size / (4 * 1024 * 1024)));
  const bar = $('uploadBar');
  $('upName').textContent = `正在处理「${file.name}」…`;
  bar.style.display = 'block';
  try {
    for (let i = 0; i < total; i++) {
      const slice = file.slice(i * 4 * 1024 * 1024, (i + 1) * 4 * 1024 * 1024);
      const r = await fetch(`/api/chunk?uploadId=${uid}&seq=${i}`, { method: 'POST', body: slice });
      if (!r.ok) throw new Error(`分片 ${i + 1} 上传失败`);
      const pct = Math.round((i + 1) / total * 92);
      $('upFill').style.width = pct + '%';
      $('upPct').textContent = `${pct}%（${i + 1}/${total} 片）`;
    }
    $('upName').textContent = `正在提取标注「${file.name}」…`;
    $('upPct').textContent = '95%';
    $('upFill').style.width = '95%';
    const r = await fetch(`/api/finish?uploadId=${uid}&name=${encodeURIComponent(file.name)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '解析失败');
    $('upFill').style.width = '100%'; $('upPct').textContent = '100%';
    await refresh();
    S.filterDoc = 'all'; renderChips(); renderList();
    showToast(`✅ ${data.updated ? '已更新' : '已收录'}「${data.name}」：提取到 ${data.noteCount} 条标注`);
    setTimeout(() => bar.style.display = 'none', 800);
  } catch (e) {
    bar.style.display = 'none';
    showToast('上传失败：' + e.message);
  }
}

/* ---------- 事件 ---------- */
$('btnUpload').onclick = () => $('fileInput').click();
$('fileInput').onchange = () => {
  for (const f of $('fileInput').files) uploadFile(f);
  $('fileInput').value = '';
};
let dragCount = 0;
document.addEventListener('dragenter', (e) => { e.preventDefault(); if (++dragCount) $('dropMask').classList.add('show'); });
document.addEventListener('dragleave', (e) => { e.preventDefault(); if (--dragCount <= 0) { dragCount = 0; $('dropMask').classList.remove('show'); } });
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault(); dragCount = 0; $('dropMask').classList.remove('show');
  for (const f of e.dataTransfer.files) uploadFile(f);
});
$('lightbox').onclick = () => $('lightbox').classList.remove('show');
$('searchBox').oninput = () => { S.q = $('searchBox').value; renderList(); };
$('btnTheme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('nh-theme', t);
  $('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
};
document.documentElement.setAttribute('data-theme', localStorage.getItem('nh-theme') || 'light');
$('btnTheme').textContent = (localStorage.getItem('nh-theme') || 'light') === 'dark' ? '☀️' : '🌙';

refresh();
</script>
</body>
</html>
