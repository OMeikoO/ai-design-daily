<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贴图笔记板</title>
<style>
  :root {
    --bg: #f2f3f7; --card: #fff; --text: #1f2329; --muted: #8a919f;
    --border: #e5e7eb; --brand: #4b3fe3; --brand-soft: rgba(75,63,227,.08);
  }
  [data-theme="dark"] {
    --bg: #14161c; --card: #1d2027; --text: #e8eaed; --muted: #8a919f;
    --border: #2c2f38; --brand: #7b74ff; --brand-soft: rgba(123,116,255,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 700; margin-right: auto; white-space: nowrap; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 9px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn:hover { border-color: var(--brand); }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }
  .note {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 3px 14px rgba(20,24,40,.06);
  }
  .note.drag-over { border-color: var(--brand); border-style: dashed; }
  .note-head { display: flex; gap: 8px; align-items: center; }
  .note-title {
    flex: 1; border: none; background: transparent; font-size: 16px; font-weight: 700;
    color: var(--text); outline: none; padding: 2px 0;
  }
  .note-title::placeholder { color: var(--muted); font-weight: 400; }
  .note-del { border: none; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .note-del:hover { color: #f03e3e; background: rgba(240,62,62,.08); }
  .note-text {
    width: 100%; border: none; background: transparent; color: var(--text); font-size: 14px;
    line-height: 1.7; outline: none; resize: none; margin-top: 6px; font-family: inherit;
    min-height: 20px;
  }
  .note-text::placeholder { color: var(--muted); }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  .imw { position: relative; }
  .imw img {
    width: 100%; height: 110px; object-fit: cover; border-radius: 8px; cursor: zoom-in;
    border: 1px solid var(--border); background: #fff; display: block;
  }
  .imw .rm {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(20,22,28,.72); color: #fff; border: none; font-size: 12px; line-height: 20px;
    cursor: pointer; opacity: 0; transition: opacity .15s;
  }
  .imw:hover .rm { opacity: 1; }
  .adder {
    margin-top: 10px; border: 1.5px dashed var(--border); border-radius: 10px; padding: 9px;
    text-align: center; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .adder:hover, .note.drag-over .adder { border-color: var(--brand); color: var(--brand); }
  .adder.busy { pointer-events: none; opacity: .6; }
  .empty { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty .big { font-size: 44px; margin-bottom: 10px; }
  .empty .how { margin-top: 10px; font-size: 12.5px; line-height: 2; }
  .lightwrap { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.78); display: none; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightwrap.show { display: flex; }
  .lightwrap img { max-width: 94%; max-height: 94%; border-radius: 8px; }
  .mask { position: fixed; inset: 0; z-index: 400; background: rgba(75,63,227,.14); display: none; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--brand); }
  .mask.show { display: flex; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 600;
    background: #2c2f38; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    display: none; box-shadow: 0 6px 24px rgba(0,0,0,.3); max-width: 80vw;
  }
  .saving { font-size: 11px; color: var(--muted); }
  @media (max-width: 640px) {
    header { padding: 10px 12px; } header h1 small { display: none; }
    main { padding: 14px 10px 60px; }
    .imw img { height: 92px; }
  }
</style>
</head>
<body>
<header>
  <h1>贴图笔记板<small>截图 → 粘贴 / 拖入 / 点选，自动保存</small></h1>
  <button class="btn" id="btnTheme">🌙</button>
  <button class="btn primary" id="btnNew">＋ 新笔记</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</header>

<div class="mask" id="dropMask">松手放到这条笔记里 📥</div>
<div class="lightwrap" id="lightbox"><img id="lightImg" alt=""></div>
<div class="toast" id="toast"></div>
<main id="list"></main>

<script>
const $ = (id) => document.getElementById(id);
const uid = () => 'n' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Date.now() + '' + Math.random().toString(16).slice(2));
let NOTES = [];
let activeNote = null;    // 粘贴目标：最后聚焦的笔记
let lastFocus = null;     // 「粘贴创建新笔记」用

function toast(msg, ms = 2600) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}

/* ---------- 图片处理：大图自动压到 1600px、转 JPEG 控制体积 ---------- */
async function shrink(file) {
  if (file.type === 'image/gif' || file.size < 600 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    return blob && blob.size < file.size ? new File([blob], 'img.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}

async function uploadImg(file) {
  const f = await shrink(file);
  const r = await fetch('/api/img', { method: 'POST', headers: { 'Content-Type': f.type }, body: f });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
  return await r.json();
}

/* ---------- 保存 ---------- */
const pending = new Map();
function queueSave(note) {
  note._dirty = true;
  clearTimeout(pending.get(note.id));
  pending.set(note.id, setTimeout(() => {
    fetch('/api/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: note.id, title: note.title, text: note.text, images: note.images })
    }).then(() => { note._dirty = false; }).catch(() => toast('保存失败，请检查网络'));
  }, 500));
}

/* ---------- 渲染 ---------- */
function renderAll() {
  const list = $('list');
  if (!NOTES.length) {
    list.innerHTML = `<div class="empty"><div class="big">🗒️</div>
      点右上角「＋ 新笔记」开始<br>
      <div class="how">截图后直接 <b>Ctrl+V 粘贴</b> · 或 <b>拖拽</b>图片进来 · 或点虚线框<b>选择文件</b><br>标题和文字随打随存</div></div>`;
    return;
  }
  list.innerHTML = NOTES.map(n => `
    <div class="note" data-id="${n.id}">
      <div class="note-head">
        <input class="note-title" placeholder="标题…" value="${(n.title || '').replace(/"/g, '&quot;')}" maxlength="60">
        <button class="note-del" title="删除这条笔记">🗑</button>
      </div>
      <textarea class="note-text" placeholder="记点什么…" rows="${Math.min(6, Math.max(1, (n.text || '').split('\n').length))}"></textarea>
      <div class="imgs"></div>
      <div class="adder">＋ 图片：点选 / 拖入 / Ctrl+V</div>
    </div>`).join('');
  list.querySelectorAll('.note').forEach(el => {
    const note = NOTES.find(x => x.id === el.dataset.id);
    const ta = el.querySelector('.note-text');
    ta.value = note.text || '';
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
    bindCard(el, note);
    renderImgs(el, note);
  });
}

function renderImgs(el, note) {
  const box = el.querySelector('.imgs');
  box.innerHTML = (note.images || []).map(im => `
    <div class="imw" data-img="${im.id}.${im.ext}">
      <img loading="lazy" src="/img/${im.id}.${im.ext}" alt="">
      <button class="rm" title="移除图片">✕</button>
    </div>`).join('');
  box.querySelectorAll('img').forEach(img => img.onclick = () => {
    $('lightImg').src = img.src; $('lightbox').classList.add('show');
  });
  box.querySelectorAll('.rm').forEach(btn => btn.onclick = async () => {
    const key = btn.parentElement.dataset.img;
    note.images = note.images.filter(i => `${i.id}.${i.ext}` !== key);
    renderImgs(el, note); queueSave(note);
    fetch('/api/img/' + key, { method: 'DELETE' });
  });
}

function bindCard(el, note) {
  const title = el.querySelector('.note-title');
  const ta = el.querySelector('.note-text');
  const adder = el.querySelector('.adder');
  title.oninput = () => { note.title = title.value; queueSave(note); };
  title.onfocus = ta.onfocus = () => { activeNote = note; };
  ta.oninput = () => {
    note.text = ta.value; queueSave(note);
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
  };
  ta.onkeydown = (e) => { if (e.key === 'Escape') ta.blur(); };
  el.querySelector('.note-del').onclick = async () => {
    if (!confirm('删除这条笔记（含图片）？')) return;
    NOTES = NOTES.filter(x => x.id !== note.id);
    renderAll();
    await fetch('/api/notes/' + note.id, { method: 'DELETE' });
    toast('已删除');
  };
  adder.onclick = () => pickFiles(note);
  // 拖拽到卡片
  el.ondragover = (e) => { e.preventDefault(); el.classList.add('drag-over'); };
  el.ondragleave = () => el.classList.remove('drag-over');
  el.ondrop = async (e) => {
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('drag-over');
    await addFiles(note, [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
  };
}

async function addFiles(note, files) {
  if (!files.length) return;
  const adder = document.querySelector(`.note[data-id="${note.id}"] .adder`);
  if (adder) { adder.classList.add('busy'); adder.textContent = `上传中… 0/${files.length}`; }
  let done = 0;
  for (const f of files) {
    try {
      const img = await uploadImg(f);
      note.images = note.images || [];
      note.images.push(img);
      done++;
      if (adder) adder.textContent = `上传中… ${done}/${files.length}`;
      queueSave(note);   // 边传边存，断了也不丢
    } catch (e) { toast('上传失败：' + e.message); }
  }
  if (adder) { adder.classList.remove('busy'); adder.textContent = '＋ 图片：点选 / 拖入 / Ctrl+V'; }
  const el = document.querySelector(`.note[data-id="${note.id}"]`);
  if (el) renderImgs(el, note);
}

/* ---------- 点选上传 ---------- */
let pickTarget = null;
function pickFiles(note) { pickTarget = note; $('fileInput').click(); }
$('fileInput').onchange = () => {
  const fs = [...$('fileInput').files];
  $('fileInput').value = '';
  if (pickTarget && fs.length) addFiles(pickTarget, fs);
};

/* ---------- 粘贴：截图直接 Ctrl+V ---------- */
document.addEventListener('paste', async (e) => {
  const files = [...(e.clipboardData?.items || [])]
    .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
    .map(it => it.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  let note = activeNote;
  if (!note) {   // 没有聚焦的笔记 → 新建一条收图
    note = { id: uid(), title: '', text: '', images: [], createdAt: new Date().toISOString() };
    NOTES.unshift(note);
    renderAll();
    document.querySelector(`.note[data-id="${note.id}"] .note-title`).focus();
    toast('已新建笔记，图片放入其中');
  }
  await addFiles(note, files);
});

/* ---------- 全局拖拽（拖到空白处 = 新建笔记） ---------- */
let dragDepth = 0;
document.addEventListener('dragenter', (e) => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault();
  if (++dragDepth && !e.target.closest('.note')) $('dropMask').classList.add('show');
});
document.addEventListener('dragleave', (e) => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; $('dropMask').classList.remove('show'); }
});
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0; $('dropMask').classList.remove('show');
  if (e.target.closest('.note')) return;   // 卡片自己的 drop 已处理
  const imgs = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  const note = { id: uid(), title: '', text: '', images: [], createdAt: new Date().toISOString() };
  NOTES.unshift(note);
  renderAll();
  document.querySelector(`.note[data-id="${note.id}"] .note-title`).focus();
  await addFiles(note, imgs);
});

/* ---------- 其他 ---------- */
$('btnNew').onclick = () => {
  const note = { id: uid(), title: '', text: '', images: [], createdAt: new Date().toISOString() };
  NOTES.unshift(note);
  renderAll();
  document.querySelector(`.note[data-id="${note.id}"] .note-title`).focus();
};
$('lightbox').onclick = () => $('lightbox').classList.remove('show');
$('btnTheme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('nh-theme', t);
  $('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
};
document.documentElement.setAttribute('data-theme', localStorage.getItem('nh-theme') || 'light');
$('btnTheme').textContent = (localStorage.getItem('nh-theme') || 'light') === 'dark' ? '☀️' : '🌙';

/* 离开页面前把未落盘的立即存 */
window.addEventListener('pagehide', () => {
  for (const [id, t] of pending) { clearTimeout(t); }
  for (const n of NOTES) if (n._dirty) {
    fetch('/api/save', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: n.id, title: n.title, text: n.text, images: n.images }) }).catch(() => {});
  }
});

fetch('/api/notes').then(r => r.json()).then(ns => {
  NOTES = Array.isArray(ns) ? ns : [];
  renderAll();
}).catch(() => renderAll());
</script>
</body>
</html>
