<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>浮生 · 一周文字人生</title>
<meta name="description" content="以周为节奏、用克制旁白还原普通人一生的文字模拟。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* 浮生 · 克制水墨文学风
   原则：纸白底、墨黑字、单一褪色朱作为锚点；衬线为主，留白即叙事 */

:root{
  --paper:#f4efe6;          /* 宣纸底 */
  --paper-2:#ece5d6;
  --ink:#26231f;            /* 墨黑 */
  --ink-soft:#5a554c;
  --ink-faint:#8a8478;
  --seal:#a8483a;           /* 褪色朱印 */
  --seal-soft:#c07a6a;
  --line:#d9d2c4;
  --shadow:0 1px 0 rgba(38,35,31,.04), 0 8px 30px -12px rgba(38,35,31,.18);
  --serif:"Noto Serif SC", "Songti SC", "STSong", serif;
  --sans:"Noto Sans SC", system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
  font-family:var(--serif);
  color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(60% 40% at 100% 110%, rgba(168,72,58,.05), transparent 70%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.85;
  letter-spacing:.02em;
}

#app{
  max-width:760px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* 顶部条 */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px 6px;
  font-family:var(--sans);
}
.topbar[hidden]{display:none;}
.topbar-left{display:flex; gap:10px; align-items:baseline;}
.age-tag{font-size:15px; color:var(--ink); font-weight:600; letter-spacing:.08em;}
.stage-tag{font-size:12px; color:var(--ink-faint); border:1px solid var(--line); padding:1px 8px; border-radius:2px;}
.ghost-btn{
  font-family:var(--sans); font-size:20px; line-height:1;
  background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:4px 8px;
}
.ghost-btn:hover{color:var(--seal);}

/* 主舞台 */
.stage{
  flex:1;
  padding:18px 26px 32px;
  display:flex; flex-direction:column;
  min-height:0;
}
.narration{
  font-size:18.5px;
  color:var(--ink);
  margin:0 0 22px;
  min-height:1.2em;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .8s ease, transform .8s ease;
}
.narration.in{opacity:1; transform:none;}
.narration .em{color:var(--seal); font-weight:500;}
.narration .ai-mark{
  font-family:var(--sans); font-size:10px; color:var(--seal-soft);
  vertical-align:super; margin-left:4px; letter-spacing:.1em;
}
.meta-line{
  font-family:var(--sans); font-size:12px; color:var(--ink-faint);
  margin:-12px 0 18px; letter-spacing:.05em;
}

/* 选项 */
.choices{display:flex; flex-direction:column; gap:10px; margin-top:auto;}
.choice{
  text-align:left;
  font-family:var(--serif);
  font-size:16.5px;
  color:var(--ink);
  background:var(--paper-2);
  border:1px solid var(--line);
  border-left:3px solid var(--seal-soft);
  padding:13px 16px;
  border-radius:2px;
  cursor:pointer;
  transition:background .18s, border-color .18s, transform .08s, opacity .18s;
  line-height:1.5;
}
.choice:hover{background:#e4ddcc; border-left-color:var(--seal);}
.choice:active{transform:translateX(2px);}
.choice.disabled{
  opacity:.42; cursor:not-allowed; border-left-color:var(--line);
}
.choice .req{
  display:block; font-family:var(--sans); font-size:11px; color:var(--ink-faint); margin-top:3px;
}
.choice .lock{font-family:var(--sans); font-size:11px; color:var(--ink-faint); margin-right:6px;}

/* 继续按钮（纯旁白节点） */
.continue-btn{
  align-self:flex-start;
  font-family:var(--serif); font-size:15px; color:var(--ink-soft);
  background:none; border:1px solid var(--line); border-radius:2px;
  padding:9px 22px; cursor:pointer; margin-top:auto;
}
.continue-btn:hover{color:var(--seal); border-color:var(--seal-soft);}

/* 属性面板 */
.attrs-panel{padding:0 26px 14px; font-family:var(--sans);}
.attrs-panel[hidden]{display:none;}
.attrs-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.attr{display:flex; flex-direction:column; gap:4px;}
.attr .lbl{font-size:11px; color:var(--ink-faint); letter-spacing:.05em;}
.attr .bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
.attr .bar > i{display:block; height:100%; background:var(--ink-soft); transition:width .5s ease;}
.attr .val{font-size:12px; color:var(--ink-soft);}
.attr.mood .bar > i{background:var(--seal-soft);}
.mood-hint{font-size:12px; color:var(--seal-soft); margin-top:8px; min-height:1em;}
.talents-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.talents-row .t{
  font-size:11px; color:var(--ink-soft); border:1px dashed var(--line);
  padding:1px 8px; border-radius:2px;
}

/* 浮层 */
.overlay{
  position:fixed; inset:0; background:rgba(38,35,31,.42);
  display:flex; align-items:center; justify-content:center; padding:24px; z-index:30;
  backdrop-filter:blur(2px);
}
.overlay[hidden]{display:none;}
.sheet{
  background:var(--paper); border:1px solid var(--line); border-radius:4px;
  padding:22px; width:100%; max-width:380px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:8px;
}
.sheet.wide{max-width:640px; max-height:80vh; overflow:auto;}
.sheet h3{margin:0 0 8px; font-size:18px; font-weight:600; color:var(--ink);}
.menu-item{
  text-align:left; font-family:var(--serif); font-size:15px; color:var(--ink);
  background:none; border:1px solid var(--line); border-radius:2px;
  padding:11px 14px; cursor:pointer;
}
.menu-item:hover{background:var(--paper-2);}
.menu-item.close{color:var(--ink-faint); margin-top:6px;}

/* 时间轴 */
.timeline{display:flex; flex-direction:column; gap:12px; margin:4px 0 16px;}
.tl-item{border-left:2px solid var(--line); padding:2px 0 2px 14px;}
.tl-item .age{font-family:var(--sans); font-size:11px; color:var(--ink-faint);}
.tl-item .txt{font-size:14.5px; color:var(--ink); margin:2px 0;}
.tl-item .ch{font-size:13px; color:var(--seal); font-style:italic;}

/* AI 设置 */
.ai-tip{font-family:var(--sans); font-size:12px; color:var(--ink-soft); line-height:1.7; margin:0 0 10px;}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px; font-family:var(--sans);}
.field > span{font-size:12px; color:var(--ink-faint);}
.field input[type=text],.field input[type=password]{
  font-family:var(--sans); font-size:13px; padding:8px 10px;
  border:1px solid var(--line); border-radius:2px; background:#fff;
}
.field.row{flex-direction:row; align-items:center; gap:8px;}
.ai-actions{display:flex; gap:8px; margin-top:6px;}
.solid-btn{
  flex:1; font-family:var(--serif); font-size:14px; color:#fff;
  background:var(--seal); border:none; border-radius:2px; padding:10px; cursor:pointer;
}
.ai-status{font-family:var(--sans); font-size:12px; color:var(--seal-soft); margin:6px 0 0; min-height:1em;}

/* AI 思考提示 */
.thinking{
  position:fixed; left:0; right:0; bottom:24px; display:flex; align-items:center; gap:6px;
  justify-content:center; font-family:var(--sans); color:var(--ink-soft); font-size:13px;
  z-index:20; pointer-events:none;
}
.thinking[hidden]{display:none;}
.thinking em{font-style:normal; margin-left:6px;}
.dot{width:6px; height:6px; border-radius:50%; background:var(--seal-soft); opacity:.4;
  animation:blink 1.2s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3; transform:scale(.8);} 40%{opacity:1; transform:scale(1.1);}}

/* 开局屏 */
.start{display:flex; flex-direction:column; gap:18px; padding-top:8vh;}
.start .title{font-size:46px; font-weight:600; letter-spacing:.3em; color:var(--ink); margin:0 0 0 4px; position:relative;}
.start .title::after{content:""; display:block; width:34px; height:6px; background:var(--seal); margin-top:14px; opacity:.7;}
.start .sub{font-size:14px; color:var(--ink-faint); font-family:var(--sans); letter-spacing:.1em; margin:0;}
.start .quote{font-size:15px; color:var(--ink-soft); font-style:italic; margin:8px 0 4px; line-height:2;}
.alloc{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
.alloc .row{display:flex; align-items:center; gap:12px; font-family:var(--sans);}
.alloc .row .name{width:64px; font-size:14px; color:var(--ink);}
.alloc .row .pts{flex:1; display:flex; gap:6px;}
.alloc .row .pt{
  width:24px; height:24px; border:1px solid var(--line); border-radius:50%;
  background:#fff; cursor:pointer; transition:all .12s;
}
.alloc .row .pt.on{background:var(--seal); border-color:var(--seal);}
.alloc .row .pt:hover{border-color:var(--seal-soft);}
.alloc .row .ctrl{display:flex; gap:6px;}
.alloc .row button{
  width:28px; height:28px; border:1px solid var(--line); background:#fff;
  border-radius:50%; cursor:pointer; font-size:15px; color:var(--ink-soft);
}
.alloc .pool{font-family:var(--sans); font-size:13px; color:var(--ink-faint); text-align:right;}
.talent-pick{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.talent-card{
  text-align:left; border:1px solid var(--line); border-radius:2px; padding:10px 12px;
  background:var(--paper-2); cursor:pointer; font-family:var(--serif);
}
.talent-card:hover{border-color:var(--seal-soft);}
.talent-card.picked{border-color:var(--seal); background:#efe6d8;}
.talent-card .tn{font-size:15px; color:var(--ink);}
.talent-card .td{font-size:12px; color:var(--ink-faint); font-family:var(--sans); margin-top:2px;}
.start-actions{display:flex; gap:10px; margin-top:14px;}
.start-actions .solid-btn{flex:1; font-size:16px; padding:13px;}
.ghost-link{
  background:none; border:none; font-family:var(--sans); font-size:13px; color:var(--ink-faint);
  cursor:pointer; text-decoration:underline;
}

/* 结局屏 */
.ending{display:flex; flex-direction:column; gap:18px; padding-top:4vh;}
.ending .grade{font-size:34px; font-weight:600; letter-spacing:.2em; color:var(--seal); margin:0;}
.ending .grade-sub{font-family:var(--sans); font-size:12px; color:var(--ink-faint); margin-top:-10px;}
.ending .narrative{font-size:17px; line-height:2.1; color:var(--ink); margin:6px 0;}
.ending .stats{font-family:var(--sans); font-size:12px; color:var(--ink-soft); line-height:2; border-top:1px solid var(--line); padding-top:12px;}
.ending .stats b{color:var(--ink); font-weight:500;}

/* 空行留白（呼吸） */
.gap{height:18px;}

/* 响应式 */
@media (max-width:560px){
  .stage{padding:14px 18px 26px;}
  .narration{font-size:17px;}
  .attrs-panel{padding:0 18px 12px;}
  .attrs-grid{grid-template-columns:repeat(5,1fr); gap:6px;}
  .start .title{font-size:38px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}

</style>
</head>
<body>
<div id="app">
  <!-- 顶部状态条 -->
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-left">
      <span class="age-tag" id="ageTag">0 岁</span>
      <span class="stage-tag" id="stageTag">婴幼</span>
    </div>
    <div class="topbar-right">
      <button class="ghost-btn" id="menuBtn" title="菜单">≡</button>
    </div>
  </header>

  <!-- 旁白与选项主区 -->
  <main class="stage" id="stage">
    <!-- 开局屏 / 游戏屏 / 结局屏 由 ui.js 注入 -->
  </main>

  <!-- 属性面板（可折叠） -->
  <section class="attrs-panel" id="attrsPanel" hidden>
    <div class="attrs-grid" id="attrsGrid"></div>
    <div class="mood-hint" id="moodHint"></div>
    <div class="talents-row" id="talentsRow"></div>
  </section>

  <!-- 菜单浮层 -->
  <div class="overlay" id="menuOverlay" hidden>
    <div class="sheet">
      <h3>浮生</h3>
      <button class="menu-item" data-act="timeline">一生时间轴</button>
      <button class="menu-item" data-act="attrs">显示 / 隐藏属性</button>
      <button class="menu-item" data-act="save">保存进度</button>
      <button class="menu-item" data-act="restart">重新投胎</button>
      <button class="menu-item" data-act="aiConfig">AI 接入设置</button>
      <button class="menu-item close" data-act="close">合上</button>
    </div>
  </div>

  <!-- 时间轴浮层 -->
  <div class="overlay" id="timelineOverlay" hidden>
    <div class="sheet wide">
      <h3>一生时间轴</h3>
      <div class="timeline" id="timelineList"></div>
      <button class="menu-item close" data-act="closeTimeline">合上</button>
    </div>
  </div>

  <!-- AI 接入浮层 -->
  <div class="overlay" id="aiOverlay" hidden>
    <div class="sheet">
      <h3>AI 接入设置</h3>
      <p class="ai-tip">引擎默认走规则文案。接入大模型后，旁白、选项与结局将由 AI 依据玩家意图与一生轨迹动态生成，而非固定模板触发。</p>
      <label class="field">
        <span>API 地址</span>
        <input type="text" id="aiEndpoint" placeholder="https://your-llm/chat/completions" />
      </label>
      <label class="field">
        <span>API Key</span>
        <input type="password" id="aiKey" placeholder="sk-..." />
      </label>
      <label class="field">
        <span>模型名</span>
        <input type="text" id="aiModel" placeholder="gpt-4o-mini / glm-4-flash ..." />
      </label>
      <label class="field row">
        <input type="checkbox" id="aiEnabled" />
        <span>启用 AI 内容生成（兜底走规则）</span>
      </label>
      <div class="ai-actions">
        <button class="solid-btn" id="aiSaveBtn">保存设置</button>
        <button class="menu-item close" data-act="closeAi">合上</button>
      </div>
      <p class="ai-status" id="aiStatus"></p>
    </div>
  </div>

  <!-- AI 正在思考提示 -->
  <div class="thinking" id="thinking" hidden>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <em id="thinkingText">正在为你这一刻落笔</em>
  </div>
</div>

<script>
// 浮生 · 数据层（千禧年定制版）
// 出生年 2000。事件池按 3:1 pacing：前期精简(几乎全旁白)→中后期丰富(每节点有选择)
// 5 条贯穿一生的暗线用 flag 串联：
//   网吧线: early_internet(8岁) → game_addict(14岁) → gaokao_*(18岁) → tech_layoff(35岁)
//   父亲线: dad_smoking(5岁) → dad_health(40岁) → parent_passing(55岁) → lookback_dad(暮年)
//   情感线: first_crush(14岁) → college_love(20岁) → heartbroken(22岁) → married(30岁) → widowed(70岁)
//   房债线: mortgage(32岁) → laid_off_35(35岁) → mid_steady(45岁) → quiet_retire(58岁)
//   城市线: beidrift(24岁) → stay_big_city(30岁) → back_home(40岁前) → retire_choice(58岁)

const STAGES = [
  { code:'S1', name:'婴幼',    ageRange:[0,3],  decisionRatio:0.08 },  // 几乎无选择
  { code:'S2', name:'学龄前',  ageRange:[4,6],  decisionRatio:0.18 },  // 1-2选择
  { code:'S3', name:'小学',    ageRange:[7,12], decisionRatio:0.30 },  // 3-4选择
  { code:'S4', name:'初中',    ageRange:[13,15],decisionRatio:0.55 },
  { code:'S5', name:'高中',    ageRange:[16,18],decisionRatio:0.72 },
  { code:'S6', name:'大学',    ageRange:[19,22],decisionRatio:0.68 },
  { code:'S7', name:'立业',    ageRange:[23,30],decisionRatio:0.62 },
  { code:'S8', name:'成家立业', ageRange:[31,45],decisionRatio:0.78 },
  { code:'S9', name:'收尾',    ageRange:[46,60],decisionRatio:0.45 },
  { code:'S10',name:'暮年',    ageRange:[61,75],decisionRatio:0.28 },
];

const MAX_AGE_WEEKS = 75 * 52 + 4; // 3904

// ---------- 天赋 ----------
const TALENTS = [
  { id:'zaoHui',   name:'早慧',     desc:'智力+2，但心境上限-1',           effects:{intel:+2,mood:-1}, caps:{mood:9} },
  { id:'linJia',   name:'邻家小孩', desc:'颜值+1，家境+1',                 effects:{charm:+1,family:+1} },
  { id:'tiRuo',    name:'体弱多病', desc:'体质-2，但疾病事件获得额外旁白', effects:{health:-2}, flag:'frail_child' },
  { id:'chengCun', name:'城中村',   desc:'家境-2，但 18 岁后家境每 5 年+1', effects:{family:-2}, flag:'shantytown' },
  { id:'zaoChan',  name:'早产儿',   desc:'体质上限锁 7，触发"奇迹康复"线索', effects:{health:0}, caps:{health:7}, flag:'preterm' },
  { id:'shuXiang', name:'书香门第', desc:'智力+1，家境+1，18 岁触发"是否继承家业"', effects:{intel:+1,family:+1}, flag:'scholar' },
  { id:'leGuan',   name:'天生的乐天', desc:'心境+2，负面事件概率略降',       effects:{mood:+2} },
  { id:'muNe',     name:'内向寡言', desc:'颜值-1，但心境更稳（上限+1）',     effects:{charm:-1}, caps:{mood:11} },
  { id:'jianRen',  name:'韧骨头',   desc:'体质+2，暮年健康衰减减半',         effects:{health:+2}, flag:'tough' },
  { id:'minGan',   name:'敏感',     desc:'智力+1，但心境-2，更易触发回忆',    effects:{intel:+1,mood:-2}, flag:'sensitive' },
];

// ---------- 千禧年时代背景事件 ----------
// triggerYear = 真实历史年份；出生年2000+年龄命中
const ERA_EVENTS = [
  { id:'era_2001_911',  triggerYear:2001, narration:'电视里反复放两栋楼倒塌的画面。你才一岁，看不懂，只觉得妈妈抱你抱得很紧。' },
  { id:'era_2003_sars', triggerYear:2003, narration:'校门口有人卖板蓝根，卖空了。空气里都是消毒水的味道。幼儿园不让你出门。' },
  { id:'era_2008_olympic', triggerYear:2008, narration:'满大街都在说"北京欢迎你"。你举着小红旗在院子里跑了一下午。' },
  { id:'era_2008_quake',  triggerYear:2008, narration:'电视里一遍遍放地震的画面。妈妈偷偷抹眼泪，问你想捐多少零花钱。' },
  { id:'era_2010_expo',   triggerYear:2010, narration:'世博会的吉祥物叫海宝。同学书包上都挂一个。' },
  { id:'era_2011_weibo',  triggerYear:2011, narration:'家里通了微博。父亲第一次在上面骂了物业，被妈妈删了。' },
  { id:'era_2012_smartphone', triggerYear:2012, narration:'父亲换了智能机，开始低头划屏。餐桌上的话变少了。' },
  { id:'era_2013_double_reduction', triggerYear:2013, narration:'学校说"减负"。可作业反而多了，因为要"素质教育"。' },
  { id:'era_2015_stockcrash', triggerYear:2015, narration:'父亲下班回来脸色很差。饭桌上没人敢问股票。' },
  { id:'era_2017_shared_bike', triggerYear:2017, narration:'满街都是小黄车小红车。你骑去上学，车筐里能塞书包。' },

// 浮生 · AI 内容层
// 设计目标：不只触发固定文案模板。当无合适固定事件、或进入回望/结局时，
// 由 AI 依据“玩家意图（当前状态画像）”动态生成旁白/选项/结局。
//
// 架构：AIProvider 接口 + RuleProvider（规则兜底）+ LLMProvider（可插拔大模型）。
// 引擎通过 ai.current() 取当前 provider；未配置或失败时自动回退 RuleProvider。


// ---------------- 意图分析：把玩家当前状态压缩成“叙事意图” ----------------
// 这是“更智能化”的核心：不靠模板命中，而是先读懂“玩家这一刻是什么处境”。
function analyzeIntent(state){
  const stage = state.currentStage;
  const a = state.attrs;
  const flags = state.flags;
  const ageY = state.ageWeeks/52;

  const tags = [];
  const moods = [];

  // 年龄节奏意图
  if (stage==='S1'||stage==='S2') tags.push('childhood_passive');        // 被动感知
  if (stage==='S4'||stage==='S5') tags.push('coming_of_age');            // 成长阵痛
  if (stage==='S7'||stage==='S8') tags.push('midlife_weight');           // 中年重压
  if (stage==='S10') tags.push('looking_back');                         // 回望

  // 情绪意图
  if (a.mood<=3){ tags.push('low_spirit'); moods.push('提不起劲','沉默','想躲开'); }
  else if (a.mood>=8){ tags.push('buoyant'); moods.push('轻快','想笑'); }
  else moods.push('平静','寻常');

  // 属性画像意图
  if (a.intel>=8) tags.push('bookish');
  if (a.charm>=7) tags.push('liked');
  if (a.health<=3) tags.push('frail');
  if (a.family>=8) tags.push('well_off');
  if (a.family<=2) tags.push('struggling');

  // 关键 flag 意图
  if (flags.includes('mortgage')) tags.push('debt_pressure');
  if (flags.includes('laid_off_35')||flags.includes('paycut_35')) tags.push('job_shaken');
  if (flags.includes('had_child')) tags.push('parenthood');
  if (flags.includes('heartbroken')) tags.push('heartache');
  if (flags.includes('widowed')) tags.push('loss');
  if (flags.includes('beidrift')||flags.includes('stay_big_city')) tags.push('drifting');

  return { stage, ageY, tags, moods, attrs:{...a}, flags:[...flags] };
}

// 把状态序列化为给 LLM 的“人物小传”（压缩上下文，控成本）
function stateToBrief(state){
  const a = state.attrs;
  const ageY = Math.floor(state.ageWeeks/52);
  const stageName = (STAGES.find(s=>s.code===state.currentStage)||{}).name||'';
  const keyFlags = state.flags.slice(-12).join('、') || '无';
  return [
    `年龄 ${ageY} 岁（${stageName}），生于 ${state.birthYear} 年`,
    `颜值${a.charm} 智力${a.intel} 体质${a.health} 家境${a.family} 心境${a.mood}`,
    `近况标志：${keyFlags}`,
  ].join('；');
}

// ---------------- Provider 接口 ----------------
class AIProvider{
  get name(){ return 'base'; }
  async ambient(state){ throw new Error('not impl'); }      // 兜底旁白节点
  async dynamicNode(state){ throw new Error('not impl'); }  // 当无固定事件时生成节点
  async retrospective(state){ throw new Error('not impl'); }
  async endingNarrative(state){ throw new Error('not impl'); }
}

// ---------------- 规则 Provider（基线，永远可用） ----------------
class RuleProvider extends AIProvider{
  get name(){ return 'rule'; }
  constructor(){ super(); this._lastAmbient = {}; } // stage -> 上次旁白，避免短期重复
  _pickAmbient(stage){
    const pool = AMBIENT[stage]||AMBIENT.S10;
    const last = this._lastAmbient[stage];
    let text = last;
    for (let t=0; t<3 && text===last && pool.length>1; t++){
      text = pool[Math.floor(Math.random()*pool.length)];
    }
    this._lastAmbient[stage] = text;
    return text;
  }
  async ambient(state){
    // 按阶段大步快进（3:1 pacing），避免反复兜底导致重复
    const stage = state.currentStage;
    let weeks = 2;
    if (stage==='S1') weeks = 24 + Math.floor(Math.random()*16);      // 24-40 周
    else if (stage==='S2') weeks = 16 + Math.floor(Math.random()*10); // 16-26 周
    else if (stage==='S3') weeks = 10 + Math.floor(Math.random()*8);  // 10-18 周
    else if (stage==='S4'||stage==='S5'||stage==='S6') weeks = 4 + Math.floor(Math.random()*5);
    else if (stage==='S7'||stage==='S8'||stage==='S9') weeks = 6 + Math.floor(Math.random()*7);
    else if (stage==='S10') weeks = 8 + Math.floor(Math.random()*9);
    return { narration: this._pickAmbient(stage), choices: [], timeAdvanceWeeks: weeks, source:'rule' };
  }
  async dynamicNode(state){
    // 规则模式：中后期无固定事件时，纯旁白 + 阶段快进过渡。
    // 选择交给固定事件（每阶段10+个）与启用 AI 时的 LLM 生成，避免装饰性微选择把节奏拖垮。
    const intent = analyzeIntent(state);
    const lines = [];
    if (intent.tags.includes('low_spirit')) lines.push(intent.moods[0]?`最近总${intent.moods[0]}。`:'最近总提不起劲。');
    if (intent.tags.includes('debt_pressure')) lines.push('手机又弹了条还款提醒。你按掉没看。');
    if (intent.tags.includes('parenthood') && intent.stage.startsWith('S8')) lines.push('孩子作业还没写完，你盯着看了会儿。');
    if (intent.tags.includes('drifting')) lines.push('地铁又晚点了。人群沉默地挪动。');
    if (intent.tags.includes('frail')) lines.push('今天膝盖又有点疼。');
    if (intent.tags.includes('looking_back')) lines.push('阳光晒得人发困。你想起了很远的事。');
    const narration = lines.length ? lines.join('') : this._pickAmbient(state.currentStage);
    const stage = state.currentStage;
    let w = 2;
    if (stage==='S4'||stage==='S5'||stage==='S6') w = 4 + Math.floor(Math.random()*5);
    else if (stage==='S7'||stage==='S8'||stage==='S9') w = 6 + Math.floor(Math.random()*7);
    else if (stage==='S10') w = 8 + Math.floor(Math.random()*9);
    return { narration, choices: [], timeAdvanceWeeks: w, source:'rule', intent };
  }
  async retrospective(state){
    // 复用 data.js 的回望逻辑（flag 驱动），规则兜底
    const ev = EVENTS.find(e=>e.id==='s10_lookback');
    if (ev && ev.narration) return { narration: ev.narration(state), source:'rule' };
    return { narration:'你想起很多个下午，阳光斜斜地照进来。', source:'rule' };
  }
  async endingNarrative(state){
    for (const t of ENDING_TEMPLATES){
      if (t.condition(state)){
        const score = scoreState(state);
        const grade = matchGrade(score);
        return { narrative: t.text(state), grade, score, source:'rule' };
      }
    }
    return { narrative:'寻常人寻常一生。', grade:GRADES[1], score:scoreState(state), source:'rule' };
  }
}

// ---------------- LLM Provider（可插拔大模型，失败回退规则） ----------------
class LLMProvider extends AIProvider{
  constructor(config){ super(); this.config = config; this.rule = new RuleProvider(); }
  get name(){ return 'llm'; }
  _available(){ return !!(this.config.enabled && this.config.endpoint && this.config.model); }

  async _chat(system, user, schemaHint){
    if (!this._available()) throw new Error('ai-not-configured');
    const body = {
      model: this.config.model,
      messages:[
        { role:'system', content: system },
        { role:'user', content: user },
      ],
      temperature: 0.85,
      max_tokens: 600,
    };
    // 通用 OpenAI 兼容 /chat/completions
    const res = await fetch(this.config.endpoint, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        ...(this.config.apiKey ? { 'Authorization': `Bearer ${this.config.apiKey}` } : {}),
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('ai-http-'+res.status);
    const data = await res.json();
    const txt = data?.choices?.[0]?.message?.content || '';
    if (!txt) throw new Error('ai-empty');
    return txt.trim();
  }

  // 系统提示词：约束 AI 遵守《浮生》文案规范（克制白描、不玩梗、≤60字）
  _systemPrompt(){
    return [
      '你是文字人生游戏《浮生》的叙事引擎。用克制、白描、感官化的旁白还原普通人一生。',
      '规则：1) 单段旁白不超过60字；2) 不许用网络梗、不抒情、不评判、不剧透未来；',
      '3) 第一人称内视角（童年可写“你”）；4) 选项不超过4个、每项≤12字、每个选项须改台词或属性或埋远期后果，禁止伪选择；',
      '5) 时代细节优先（粮票、下海、考公、房贷、口罩等）替代梗；6) 平凡温暖与困顿并存，不刻意悲苦。',
      '必须返回严格JSON，不要任何多余文字。',
    ].join('');
  }

  async ambient(state){
    if (!this._available()) return this.rule.ambient(state);
    try{
      const intent = analyzeIntent(state);
      const txt = await this._chat(this._systemPrompt(),
        `玩家此刻：${stateToBrief(state)}。意图标签：${intent.tags.join('、')||'无'}。\n`+
        `生成一段此刻的旁白（纯白描，不给选项）。只返回JSON：{"narration":"..."}。`);
      const o = JSON.parse(stripFence(txt));
      if (!o.narration) throw new Error('bad-json');
      return { narration:o.narration, choices:[], timeAdvanceWeeks:2, source:'llm', intent };
    }catch(e){ return this.rule.ambient(state); }
  }

  async dynamicNode(state){
    if (!this._available()) return this.rule.dynamicNode(state);
    try{
      const intent = analyzeIntent(state);
      const user =
        `玩家此刻：${stateToBrief(state)}。\n意图：${intent.tags.join('、')||'寻常'}。\n`+
        `生成一个剧情节点：一段旁白 + 2~3个选项。每个选项含 effects（仅限 charm/intel/health/family/mood 的 +/-1 数值）与 timeAdvanceWeeks(0~12 整数)。\n`+
        `只返回JSON：{"narration":"...","choices":[{"text":"...","effects":{},"timeAdvanceWeeks":N}]}。`;
      const txt = await this._chat(this._systemPrompt(), user);
      const o = JSON.parse(stripFence(txt));
      const choices = (o.choices||[]).map(c=>({ text:String(c.text).slice(0,12), effects:cleanEffects(c.effects), timeAdvanceWeeks:clampWeeksA(c.timeAdvanceWeeks) }));
      return { narration:String(o.narration||'').slice(0,120), choices, timeAdvanceWeeks: choices.length?0:2, source:'llm', intent };
    }catch(e){ return this.rule.dynamicNode(state); }
  }

  async retrospective(state){
    if (!this._available()) return this.rule.retrospective(state);
    try{
      const user =
        `玩家已至暮年。一生关键选择：${state.flags.slice(-16).join('、')||'无'}。\n`+
        `写一段第一人称回忆，回引他做过的具体选择（读 flags 推断），克制、不煽情，≤80字。\n`+
        `只返回JSON：{"narration":"..."}。`;
      const txt = await this._chat(this._systemPrompt(), user);
      const o = JSON.parse(stripFence(txt));
      if (!o.narration) throw new Error('bad-json');
      return { narration:o.narration, source:'llm' };
    }catch(e){ return this.rule.retrospective(state); }
  }

  async endingNarrative(state){
    if (!this._available()) return this.rule.endingNarrative(state);
    try{
      const score = scoreState(state);
      const grade = matchGrade(score);
      const user =
        `玩家一生结束。画像：${stateToBrief(state)}。享年${Math.floor(state.ageWeeks/52)}。\n`+
        `关键选择（按序）：${state.flags.slice(-24).join('、')||'无'}。\n`+
        `写一段200~400字的一生回望散文，引用他做过的3~5个具体选择。克制、不抒情、中性收束。叙事为主。\n`+
        `只返回JSON：{"narrative":"..."}。`;
      const txt = await this._chat(this._systemPrompt(), user);
      const o = JSON.parse(stripFence(txt));
      if (!o.narrative) throw new Error('bad-json');
      return { narrative:o.narrative, grade, score, source:'llm' };
    }catch(e){ return this.rule.endingNarrative(state); }
  }
}

// ---------------- 工具 ----------------
function stripFence(s){ // 去掉 ```json 包裹
  let t = s.trim();
  if (t.startsWith('```')) t = t.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  return t;
}
function clampWeeksA(n){ n = parseInt(n,10); if (isNaN(n)||n<0) return 2; if (n>12) return 12; return n; }
function cleanEffects(e){
  const out={}; if (!e||typeof e!=='object') return out;
  for (const k of ['charm','intel','health','family','mood']){
    if (typeof e[k]==='number') out[k] = Math.max(-3, Math.min(3, e[k]|0));
  }
  return out;
}
function scoreState(state){
  const a=state.attrs; const peak=a.charm+a.intel+a.health+a.family+a.mood;
  const moodAvg = state._moodSum!=null && state._moodCount ? state._moodSum/state._moodCount : a.mood;
  return Math.round(peak*4 + moodAvg*4);
}
function matchGrade(score){ return [...GRADES].reverse().find(g=>score>=g.min)||GRADES[0]; }

// 浮生 · 引擎层
// 事件触发优先级链（设计 §5.2）：主分支 → 属性阈值 → 年龄段 → 时代 → 关系 → AI 兜底
// + 状态管理 / Flags / 存档 / 时间快进硬校验（≤12 周）


const SAVE_KEY = 'fusheng_save_v1';

// ---------------- 工具：requirement 表达式求值 ----------------
// 支持 ">=5" "<=3" ">4" "<6" "==7" "!=0"
function evalReq(req, attrs, flags){
  if (!req) return true;
  for (const k in req){
    const v = req[k];
    if (k==='flags'){
      // 任意一个 flag 存在即满足（用于 excludeIf 时反向）
      const arr = Array.isArray(v)?v:[v];
      if (!arr.some(f=>flags.includes(f))) return false;
      continue;
    }
    if (!(k in attrs)) continue;
    const op = String(v).match(/^([<>=!]=?)(-?\d+)$/);
    if (!op) continue;
    const val = +op[2], opf = op[1];
    const cur = attrs[k];
    if (opf==='>=' && !(cur>=val)) return false;
    if (opf==='<=' && !(cur<=val)) return false;
    if (opf==='>'  && !(cur>val))  return false;
    if (opf==='<'  && !(cur<val))  return false;
    if (opf==='==' && !(cur===val)) return false;
    if (opf==='!=' && !(cur!==val)) return false;
  }
  return true;
}

// excludeIf：满足任一排除条件则跳过
function isExcluded(ev, state){
  if (!ev.excludeIf) return false;
  for (const k in ev.excludeIf){
    if (k==='flags'){
      const arr = Array.isArray(ev.excludeIf.flags)?ev.excludeIf.flags:[ev.excludeIf.flags];
      if (arr.some(f=>state.flags.includes(f))) return true;
    }
  }
  return false;
}

function stageOf(ageWeeks){
  // 用整数岁匹配 ageRange，避免 3岁29周(=3.558)落入 S1[0,3]/S2[4,6] 整数空隙被误判为 S10
  const y = Math.floor(ageWeeks/52);
  for (const s of STAGES){ if (y>=s.ageRange[0] && y<=s.ageRange[1]) return s.code; }
  return ageWeeks/52 > STAGES[STAGES.length-1].ageRange[1] ? 'S10' : 'S1';
}
function stageName(code){ return (STAGES.find(s=>s.code===code)||{}).name||''; }

// ---------------- 状态 ----------------
function newRun(birthYear, attrs, talentIds){
  const state = {
    birthYear,
    ageWeeks: 0,
    attrs: { charm:1, intel:1, health:1, family:1, mood:5, ...attrs },
    flags: [],
    talents: talentIds,
    history: [],
    currentStage: 'S1',
    _moodSum: 5, _moodCount: 1,
    _triggered: [],          // 已触发的 once 事件 id
    _eraFired: [],           // 已触发的时代事件 id
    _familyBonusYear: -1,    // 城中村 18 岁起每 5 年家境+1 跟踪
  };
  // 应用天赋
  for (const tid of talentIds){
    const t = TALENTS.find(x=>x.id===tid); if (!t) continue;
    applyEffects(state, t.effects||{});
    if (t.flag) state.flags.push(t.flag);
  }
  state.currentStage = stageOf(state.ageWeeks);
  return state;
}

// 应用属性变化，并按上限 clamp；记录心境均值
function applyEffects(state, effects){
  const caps = {};
  // 从天赋读取 caps
  for (const tid of state.talents){
    const t = TALENTS.find(x=>x.id===tid);
    if (t && t.caps) Object.assign(caps, t.caps);
  }
  for (const k in effects){
    if (!(k in state.attrs)) continue;
    let v = state.attrs[k] + effects[k];
    if (caps[k]!=null) v = Math.min(v, caps[k]);
    v = Math.max(0, Math.min(12, v));            // 硬上下限 0~12（天赋可超 10）
    state.attrs[k] = v;
  }
}

// ---------------- 触发引擎 ----------------
function pickNext(state){
  const ageY = state.ageWeeks/52;
  state.currentStage = stageOf(state.ageWeeks);

  // 城中村逆袭线：18 岁起每 5 年家境+1
  if (state.talents.includes('chengCun')){
    if (ageY>=18 && state._familyBonusYear<0){ state._familyBonusYear = 18; state.attrs.family = Math.min(12, state.attrs.family+1); }
    else if (state._familyBonusYear>0 && ageY>=state._familyBonusYear+5){
      state._familyBonusYear += 5; state.attrs.family = Math.min(12, state.attrs.family+1);
    }
  }

  // 1. 主分支 / nextNode 跳转优先
  // 2. 属性阈值事件
  // 3. 年龄段事件
  // 4. 时代事件
  // 5. AI 兜底（动态节点）
  const candidates = [];
  for (const ev of EVENTS){
    if (ev.weight<=0) continue;
    if (ev.stage!==state.currentStage) continue;
    const [a0,a1] = ev.ageRange;
    if (ageY<a0 || ageY>a1+0.99) continue;
    if (ev.once && state._triggered.includes(ev.id)) continue;
    if (isExcluded(ev, state)) continue;
    if (!evalReq(ev.requirement, state.attrs, state.flags)) continue;
    candidates.push(ev);
  }
  // 主分支强制
  const main = candidates.filter(e=>e.kind==='mainBranch');
  if (main.length){ const ev = pickWeighted(main); return resolveNode(state, ev); }

  // 属性阈值
  const thr = candidates.filter(e=>e.kind==='threshold');
  if (thr.length){ const ev = pickWeighted(thr); return resolveNode(state, ev); }

  // 年龄段
  const stage = candidates.filter(e=>e.kind==='stage');
  if (stage.length && Math.random()<0.7){ const ev = pickWeighted(stage); return resolveNode(state, ev); }

  // 时代事件（出生年+年龄命中真实年份）
  const calYear = state.birthYear + Math.floor(ageY);
  const era = ERA_EVENTS.find(e=>e.triggerYear===calYear && !state._eraFired.includes(e.id));
  if (era){ state._eraFired.push(era.id); return { id:era.id, stage:state.currentStage, narration:era.narration, choices:[], timeAdvanceWeeks:2, kind:'era', source:'era' }; }

  // 关系事件（父母线简化：30 岁后随机一次父母唠叨）
  if (ageY>=30 && !state._triggered.includes('rel_parent') && Math.random()<0.25){
    state._triggered.push('rel_parent');
    return { id:'rel_parent', stage:state.currentStage, narration:'母亲打电话来，问你吃没吃饭。说了十分钟，又说没事。', choices:[{ text:'嗯嗯啊啊', effects:{mood:+0}, timeAdvanceWeeks:2 }], timeAdvanceWeeks:2, kind:'relation', source:'rule' };
  }

  // AI 兜底：动态节点（可走 LLM 或规则）
  return null; // 交由 main 调用 ai.current().dynamicNode(state) 生成
}

// nextNode 跳转：返回指定事件（result 节点）
function jumpTo(state, nodeId){
  const ev = EVENTS.find(e=>e.id===nodeId);
  if (!ev) return null;
  return resolveNode(state, ev);
}

function resolveNode(state, ev){
  if (ev.once) state._triggered.push(ev.id);
  const narration = typeof ev.narration==='function' ? ev.narration(state) : ev.narration;
  return {
    id: ev.id, stage: ev.stage, narration, kind: ev.kind,
    choices: (ev.choices||[]).map(c=>({
      ...c,
      locked: c.requirement ? !evalReq(c.requirement, state.attrs, state.flags) : false,
      narration: typeof c.narration==='function' ? c.narration(state) : c.narration,
    })),
    timeAdvanceWeeks: ev.timeAdvanceWeeks || 0,
    source:'rule',
  };
}

function pickWeighted(arr){
  const total = arr.reduce((s,e)=>s+(e.weight||1),0);
  let r = Math.random()*total;
  for (const e of arr){ r -= (e.weight||1); if (r<=0) return e; }
  return arr[arr.length-1];
}

// ---------------- 执行一次选择 ----------------
function applyChoice(state, node, choiceIndex){
  const choice = node.choices?.[choiceIndex];
  if (!choice || choice.locked) return null;
  // 时间快进硬校验（设计 §11.5）
  const adv = clampWeeks(choice.timeAdvanceWeeks || 0);
  applyEffects(state, choice.effects||{});
  if (choice.setFlags) for (const f of choice.setFlags) if (!state.flags.includes(f)) state.flags.push(f);
  // 记录节点日志（用于回望/时间轴）
  pushHistory(state, node, choice);
  // 心境均值统计
  state._moodSum += state.attrs.mood; state._moodCount += 1;
  state.ageWeeks += adv;
  return choice;
}
// 纯旁白节点推进：前期大步快进不受 12 周硬限（clampAmbientWeeks 上限 60）
function applyAmbientAdvance(state, node, weeks){
  pushHistory(state, node, null);
  state._moodSum += state.attrs.mood; state._moodCount += 1;
  state.ageWeeks += clampAmbientWeeks(weeks||2);
}
function clampAmbientWeeks(n){ n=parseInt(n,10); if(isNaN(n)||n<0)return 2; if(n>60)return 60; return n; }

function pushHistory(state, node, choice){
  state.history.push({
    nodeId: node.id,
    ageWeeks: state.ageWeeks,
    narration: node.narration,
    choiceText: choice ? choice.text : null,
    flagsSet: choice?.setFlags||[],
    source: node.source||'rule',
  });
}

function clampWeeks(n){ n=parseInt(n,10); if(isNaN(n)||n<0)return 2; if(n>12)return 12; return n; }

// ---------------- 回望 / 结局 ----------------
async function buildEnding(state){
  // 叙事结局优先交给 AI（若启用）
  const ai = current();
  let r;
  try{ r = await ai.endingNarrative(withMoodAvg(state)); }
  catch{ r = await new RuleProvider().endingNarrative(withMoodAvg(state)); }
  return r;
}
async function buildRetrospective(state){
  const ai = current();
  try{ return await ai.retrospective(withMoodAvg(state)); }
  catch{ return { narration:'你想起很多个下午，阳光斜斜地照进来。', source:'rule' }; }
}
// AI 意图（暴露给 UI 调试 / 未来扩展）
function getIntent(state){ return analyzeIntent(state); }

function withMoodAvg(state){
  // 给结局模板一个 moodAvg 字段
  return { ...state, moodAvg: state._moodSum / Math.max(1,state._moodCount) };
}

// ---------------- 存档 ----------------
function save(state){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); return true; }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch{ return null; } }
function clearSave(){ localStorage.removeItem(SAVE_KEY); }
function hasSave(){ return !!localStorage.getItem(SAVE_KEY); }

// ---------------- 属性面板 ----------------
const ATTR_LABEL = { charm:'颜值', intel:'智力', health:'体质', family:'家境', mood:'心境' };
function updateAttrs(state){
  $('attrsPanel').hidden=false;
  const g = $('attrsGrid'); g.innerHTML='';
  for (const k of ['charm','intel','health','family','mood']){
    const v = state.attrs[k];
    const div = document.createElement('div');
    div.className = 'attr'+(k==='mood'?' mood':'');
    div.innerHTML = `<span class="lbl">${ATTR_LABEL[k]}</span>
      <div class="bar"><i style="width:${Math.min(100,v*10)}%"></i></div>
      <span class="val">${k==='mood' ? moodWord(v) : v}</span>`;
    g.appendChild(div);
  }
  // 心境提示
  $('moodHint').textContent = state.attrs.mood<=3 ? '最近总提不起劲。' : (state.attrs.mood>=9 ? '心里轻快。' : '');
  // 天赋
  const tr = $('talentsRow'); tr.innerHTML='';
  for (const tid of state.talents){
    const t = TALENTS.find(x=>x.id===tid); if(!t) continue;
    const s = document.createElement('span'); s.className='t'; s.textContent=t.name; tr.appendChild(s);
  }
}
function moodWord(v){ return v<=2?'阴':v<=4?'阴':v<=6?'晴':v<=8?'晴':'晴'; }

// ---------------- 开局屏 ----------------
function renderStart(container, cb){
  const birthYear = 2000; // 千禧一代定制
  const alloc = { charm:4, intel:4, health:4, family:4, mood:4 }; // 共20点，每项最低1
  const picked = new Set();

  container.innerHTML = `
    <div class="start">
      <h1 class="title">浮生</h1>
      <p class="sub">千禧一代 · 文字人生 · 0–75 岁</p>
      <p class="quote">“人这一辈子，说是长，其实也就那么几件事。”</p>

      <div class="alloc" id="allocWrap"></div>
      <p class="pool" id="poolTxt"></p>

      <p class="sub" style="margin-top:14px">出身于 ${birthYear} 年 · 选 3 个天赋即可投胎</p>
      <div class="talent-pick" id="talentWrap"></div>

      <div class="start-actions">
        <button class="solid-btn" id="beginBtn" disabled>投胎</button>
      </div>
      <button class="ghost-link" id="resumeBtn" hidden>读取上次一生</button>
    </div>`;

  const wrap = $('allocWrap');
  const usedPoints = ()=>Object.values(alloc).reduce((s,x)=>s+x,0);
  function bump(k, delta){
    const nv = alloc[k] + delta;
    if (nv < 1 || nv > 10) return;
    if (delta > 0 && usedPoints() >= 20) return; // 无富余点数
    alloc[k] = nv; refreshAlloc();
  }
  for (const k of Object.keys(alloc)){
    const row = document.createElement('div'); row.className='row'; row.dataset.k=k;
    row.innerHTML = `<span class="name">${ATTR_LABEL[k]}</span>
      <div class="pts"></div>
      <div class="ctrl">
        <button type="button" data-d="-1" aria-label="减少">−</button><span class="val" style="width:18px;text-align:center;font-family:var(--sans)"></span><button type="button" data-d="1" aria-label="增加">+</button>
      </div>`;
    wrap.appendChild(row);
    row.querySelectorAll('button[data-d]').forEach(btn=>{
      btn.onclick = ()=> bump(k, parseInt(btn.dataset.d,10));
    });
  }
  function refreshAlloc(){
    for (const row of wrap.querySelectorAll('.row')){
      const k=row.dataset.k; const v=alloc[k];
      const pts=row.querySelector('.pts'); pts.innerHTML='';
      for(let i=1;i<=10;i++){ const d=document.createElement('div'); d.className='pt'+(i<=v?' on':'');
        d.onclick=()=>{
          const used=usedPoints();
          if(i>alloc[k] && used + (i-alloc[k]) > 20) return;
          alloc[k]=i; refreshAlloc();
        };
        pts.appendChild(d);
      }
      row.querySelector('.val').textContent=v;
    }
    $('poolTxt').textContent = usedPoints()===20
      ? `已分配 ${usedPoints()}/20（每项 4，可用 +/- 调整分布，或直接选 3 天赋投胎）`
      : `可分配 ${20-usedPoints()}/20（每项 1–10，共 20 点）`;
  }
  refreshAlloc();

  const tw=$('talentWrap');
  for(const t of TALENTS){
    const c=document.createElement('div'); c.className='talent-card'; c.dataset.id=t.id;
    c.innerHTML=`<div class="tn">${t.name}</div><div class="td">${t.desc}</div>`;
    c.onclick=()=>{
      if(picked.has(t.id)){ picked.delete(t.id); c.classList.remove('picked'); }
      else if(picked.size<3){ picked.add(t.id); c.classList.add('picked'); }
      else return;
      $('beginBtn').disabled = picked.size!==3;
    };
    tw.appendChild(c);
  }
  $('beginBtn').onclick=()=>{ cb.onStart({ birthYear, attrs:{...alloc}, talentIds:[...picked] }); };

  if(cb.hasResume){ const b=$('resumeBtn'); b.hidden=false; b.onclick=()=>cb.onResume(); }
}

// ---------------- 游戏节点 ----------------
function renderNode(container, node, state, cb){
  container.innerHTML='';

  const n = document.createElement('p'); n.className='narration';
  // AI 来源标记
  if(node.source==='llm'){ const m=document.createElement('span'); m.className='ai-mark'; m.textContent='AI'; }
  container.appendChild(n);

  const meta = document.createElement('div'); meta.className='meta-line';
  meta.textContent = node.source==='llm' ? '此刻 · 由 AI 依据你的处境落笔' : (node.source==='era'?'时代背景音':'');
  container.appendChild(meta);

  // 打字/淡入
  requestAnimationFrame(()=>{ n.innerHTML = markEm(node.narration); requestAnimationFrame(()=>n.classList.add('in')); });

  const choicesWrap = document.createElement('div'); choicesWrap.className='choices';
  container.appendChild(choicesWrap);

  if(node.choices && node.choices.length){
    node.choices.forEach((c,i)=>{
      const b=document.createElement('button'); b.className='choice'+(c.locked?' disabled':'');
      b.innerHTML = `${c.locked?'<span class="lock">🔒</span>':''}${escapeHtml(c.text)}` +
        (c.locked?`<span class="req">${reqText(c.requirement)}</span>`:'');
      if(!c.locked) b.onclick=()=>cb.onChoice(i);
      choicesWrap.appendChild(b);
    });
  } else {
    // 纯旁白节点：给一个“继续”按钮
    const cb2=document.createElement('button'); cb2.className='continue-btn'; cb2.textContent='… 继续';
    cb2.onclick=()=>cb.onChoice(-1);
    choicesWrap.appendChild(cb2);
  }
}
function markEm(t){ // 简单把书名号内容标红
  return escapeHtml(t).replace(/《([^》]+)》/g,'<span class="em">《$1》</span>');
}
function reqText(req){ if(!req) return ''; return Object.entries(req).map(([k,v])=>`${ATTR_LABEL[k]||k}${v}`).join('、')+' 才可选'; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------------- 结局屏 ----------------
function renderEnding(container, result, state){
  const y=Math.floor(state.ageWeeks/52);
  const a=state.attrs;
  container.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='ending';
  wrap.innerHTML=`
    <h2 class="grade">${result.grade.name}</h2>
    <p class="grade-sub">数值评级 · ${result.grade.desc}</p>
    <p class="narrative">${escapeHtml(result.narrative)}</p>
    <div class="stats">
      <b>享年</b> ${y} 岁　
      <b>五维峰值</b> 颜值${a.charm} / 智力${a.intel} / 体质${a.health} / 家境${a.family} / 心境${a.mood}<br>
      <b>一生抉择</b> ${state.history.filter(h=>h.choiceText).length} 次　
      <b>叙事来源</b> ${result.source==='llm'?'AI 生成':'规则生成'}
    </div>
    <div class="start-actions">
      <button class="solid-btn" id="againBtn">再活一次</button>
      <button class="ghost-link" id="tlBtn" style="flex:0 0 auto;border:1px solid var(--line);padding:10px 16px">回看一生</button>
    </div>`;
  container.appendChild(wrap);
  $('againBtn').onclick=()=>location.reload();
  $('tlBtn').onclick=()=>{ renderTimeline(state.history); $('timelineOverlay').hidden=false; };
  hideTopbar();
}

// ---------------- 时间轴 ----------------
function renderTimeline(history){
  const list=$('timelineList'); list.innerHTML='';
  if(!history.length){ list.innerHTML='<p style="color:var(--ink-faint)">还没有走过任何一段。</p>'; return; }
  history.forEach(h=>{
    const y=(h.ageWeeks/52).toFixed(1);
    const it=document.createElement('div'); it.className='tl-item';
    it.innerHTML=`<div class="age">${y} 岁${h.source==='llm'?' · AI':''}</div>
      <div class="txt">${escapeHtml(h.narration)}</div>
      ${h.choiceText?`<div class="ch">→ ${escapeHtml(h.choiceText)}</div>`:''}`;
    list.appendChild(it);
  });
}

// ---------------- AI 思考提示 ----------------
function showThinking(on, text){
  const t=$('thinking'); t.hidden=!on;
  if(on && text) $('thinkingText').textContent=text;
}


/* ---- file boundary ---- */

// 浮生 · 入口与游戏循环

const stageEl = document.getElementById('stage');
let state = null;
let currentNode = null;

// ---------------- 启动 ----------------
boot();

function boot(){
  bindMenu();
  bindAIConfig();
  // 开局屏
  renderStart(stageEl, {
    hasResume: hasSave(),
    onStart: ({ birthYear, attrs, talentIds }) => {
      state = newRun(birthYear, attrs, talentIds);
      save(state);
      updateTopbar(state); updateAttrs(state);
      nextTurn();
    },
    onResume: () => {
      const s = load();
      if (!s){ alert('没有可继续的一生'); return; }
      state = s; updateTopbar(state); updateAttrs(state);
      nextTurn();
    },
  });
}

// ---------------- 游戏循环 ----------------
async function nextTurn(){
  if (state.ageWeeks >= MAX_AGE_WEEKS || state.attrs.health<=0){
    return finish();
  }
  updateTopbar(state); updateAttrs(state);

  // 引擎按优先级链挑选
  let node = pickNext(state);

  if (node===null){
    // 无固定事件 → 走 AI 兜底
    // 前期(S1-S3)优先纯旁白快进，制造"被生活推着走"的无力感并避免重复；
    // 中后期(S4+)走 dynamicNode，由 AI 依据意图生成带选择的节点
    const ai = current();
    const early = ['S1','S2','S3'].includes(state.currentStage);
    if (isAIActive() && !early){ showThinking(true, '正在为你这一刻落笔'); }
    try {
      node = early ? await ai.ambient(state) : await ai.dynamicNode(state);
    }
    catch { node = await ai.ambient(state); }
    finally { showThinking(false); }
    node = { ...node, stage: state.currentStage, kind: early?'ambient':'dynamic', choices: node.choices||[], timeAdvanceWeeks: node.timeAdvanceWeeks ?? 2 };
  }

  // 暮年回望：到 S10 且未触发过回望节点，且本节点非回望本身
  if (state.currentStage==='S10' && !state._triggered.includes('s10_lookback') && node.id!=='s10_lookback'){
    state._triggered.push('s10_lookback');
    const ai = current();
    showThinking(true, '回望这一生');
    try {
      const ret = await ai.retrospective(state);
      showThinking(false);
      // 先插播一段回望，再进入本节点
      await playRetrospective(ret.narration);
    } catch { showThinking(false); }
  }

  currentNode = node;
  renderNode(stageEl, node, state, { onChoice: handleChoice });
}

async function playRetrospective(text){
  // 把回望作为一段纯旁白节点呈现，等玩家“继续”
  return new Promise(resolve=>{
    renderNode(stageEl, { id:'lookback', stage:'S10', narration:text, choices:[], timeAdvanceWeeks:2, source:'llm' },
      state, { onChoice: ()=>resolve() });
  });
}

function handleChoice(idx){
  if (idx===-1){
    // 纯旁白继续：按阶段大步快进，制造"被生活推着走"的无力感，避免反复兜底
    let w = currentNode.timeAdvanceWeeks;
    if (!w || w <= 2){
      const st = state.currentStage;
      if (st==='S1') w = 24 + Math.floor(Math.random()*16);      // 24-40 周（半年-1年）
      else if (st==='S2') w = 16 + Math.floor(Math.random()*10); // 16-26 周
      else if (st==='S3') w = 10 + Math.floor(Math.random()*8);  // 10-18 周
      else if (st==='S4'||st==='S5'||st==='S6') w = 4 + Math.floor(Math.random()*5);  // 4-8 周
      else if (st==='S7'||st==='S8'||st==='S9') w = 6 + Math.floor(Math.random()*7);   // 6-12 周
      else if (st==='S10') w = 8 + Math.floor(Math.random()*9);                        // 8-16 周
      else w = 2;
    }
    applyAmbientAdvance(state, currentNode, w);
    save(state);
    return nextTurn();
  }
  const choice = applyChoice(state, currentNode, idx);
  if (!choice){ return; } // 锁定项忽略
  // 选项内嵌的“选后旁白”
  if (choice.narration){
    renderNode(stageEl, { id:currentNode.id+'_r', stage:state.currentStage, narration:choice.narration, choices:[], timeAdvanceWeeks:0, source:'rule' },
      state, { onChoice:()=>{ save(state); nextTurn(); } });
    // 把这次推进放回到继续时（applyChoice 已推进时间）
    return;
  }
  // nextNode 跳转
  if (choice.nextNode){
    const jump = jumpTo(state, choice.nextNode);
    if (jump){ currentNode = jump; save(state); renderNode(stageEl, jump, state, { onChoice: handleChoice }); return; }
  }
  save(state);
  nextTurn();
}

// ---------------- 结局 ----------------
async function finish(){
  showThinking(true, '翻看这一生');
  let result;
  try { result = await buildEnding(state); }
  catch { result = { narrative:'寻常人寻常一生。', grade:{name:'寻常',desc:'平平一生。'}, score:0, source:'rule' }; }
  showThinking(false);
  clearSave();
  renderEnding(stageEl, result, state);
}

// ---------------- 菜单 ----------------
function bindMenu(){
  document.getElementById('menuBtn').onclick = ()=>{ document.getElementById('menuOverlay').hidden=false; };
  document.querySelectorAll('#menuOverlay .menu-item').forEach(b=>{
    b.onclick=()=>{
      document.getElementById('menuOverlay').hidden=true;
      const a=b.dataset.act;
      if(a==='timeline'){ renderTimeline(state?state.history:[]); document.getElementById('timelineOverlay').hidden=false; }
      else if(a==='attrs'){ const p=document.getElementById('attrsPanel'); p.hidden=!p.hidden; }
      else if(a==='save'){ if(state){ save(state); flash('已保存'); } }
      else if(a==='restart'){ if(confirm('重新投胎？当前一生会丢失。')){ clearSave(); location.reload(); } }
      else if(a==='aiConfig'){ openAIConfig(); }
    };
  });
  document.querySelector('#timelineOverlay .close').onclick=()=>{ document.getElementById('timelineOverlay').hidden=true; };
}
function flash(msg){ const s=document.getElementById('aiStatus'); if(s){ s.textContent=msg; setTimeout(()=>s.textContent='',1200);} }

// ---------------- AI 接入设置 ----------------
function bindAIConfig(){
  const o=document.getElementById('aiOverlay');
  document.querySelector('#aiOverlay .close').onclick=()=>o.hidden=true;
  document.getElementById('aiSaveBtn').onclick=()=>{
    setAIConfig({
      endpoint: document.getElementById('aiEndpoint').value.trim(),
      apiKey: document.getElementById('aiKey').value.trim(),
      model: document.getElementById('aiModel').value.trim(),
      enabled: document.getElementById('aiEnabled').checked,
    });
    const s=document.getElementById('aiStatus');
    s.textContent = isAIActive() ? '已启用 AI 内容生成。无合适固定事件、回望与结局将动态生成。' : '未启用，引擎走规则文案。';
  };
}
function openAIConfig(){
  const c=getAIConfig();
  document.getElementById('aiEndpoint').value=c.endpoint||'';
  document.getElementById('aiKey').value=c.apiKey||'';
  document.getElementById('aiModel').value=c.model||'';
  document.getElementById('aiEnabled').checked=!!c.enabled;
  document.getElementById('aiStatus').textContent = isAIActive() ? '当前：AI 已启用' : '当前：规则文案（未启用 AI）';
  document.getElementById('aiOverlay').hidden=false;
}
